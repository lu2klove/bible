      html += '<option value="'+escapeHtml(t.name)+'"'+(e.activity_type===t.name?' selected':'')+'>'+(t.name==='기도요청'?'\u2020 ':'')+escapeHtml(t.name)+'</option>';
    });
    html += '</select></div>';
  }
  html += '<div class="field"><span class="field-label">메모</span><textarea id="act_memo" rows="2" placeholder="선택 입력">'+escapeHtml(e.memo||'')+'</textarea></div>';
  html += '<hr style="border:none;border-top:1px solid var(--line);margin:14px 0;">';

  if(!readOnly){
  html += '<div id="act_locationSection">';
  html += '<div class="field"><span class="field-label">장소</span>';
  html += '<div class="row2"><input type="text" id="act_locationName" placeholder="예: 은혜교회 3층 소모임실" value="'+escapeHtml(e.location_name||'')+'" style="flex:2;">';
  html += '<button type="button" class="btn" id="act_mapSearchBtn" style="flex:1;display:flex;align-items:center;justify-content:center;gap:5px;">'+icoSpan('map',0.9)+' 지도에서 찾기</button></div></div>';
  html += '<button type="button" class="btn" id="act_gpsBtn" style="width:100%;margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:6px;">'+icoSpan('location')+' 현재 위치로 지도 좌표 담기</button>';
  html += '<p class="savehint" id="act_gpsStatus" style="margin-bottom:12px;">'+(e.location_lat?'현재 좌표가 담겨 있어요('+e.location_lat.toFixed(4)+', '+e.location_lng.toFixed(4)+').':'좌표를 담으면 지도로 바로 열어볼 수 있어요.')+'</p>';
  html += '</div>';

  html += '<div id="act_receiptSection">';
  html += '<div class="field"><span class="field-label">영수증 사진 (선택, 최대 2장)</span>';
  html += '<input type="file" accept="image/*" multiple id="act_receiptMultiInput" style="display:none;">';
  html += '<div id="act_receiptGallery" style="display:flex;gap:8px;flex-wrap:wrap;">'+multiImageGalleryHTML('act_receipt', [e.receipt_image, e.receipt_image2].filter(Boolean), 2)+'</div>';
  html += '</div>';
  html += '</div>';
  }else if(e.location_name || e.location_lat){
    html += '<p class="savehint" style="margin-bottom:12px;">'+icoSpan('location',0.8)+' '+escapeHtml(e.location_name||'')+'</p>';
  }

  html += '<div class="field"><span class="field-label">활동 사진 (선택, 최대 3장)</span>';
  html += '<input type="file" accept="image/*" multiple id="act_photoMultiInput" style="display:none;">';
  html += '<div id="act_photoGallery" style="display:flex;gap:8px;flex-wrap:wrap;">'+multiImageGalleryHTML('act_photo', [e.photo_image, e.photo_image2, e.photo_image3].filter(Boolean), 3)+'</div>';
  html += '</div>';

  html += '<hr style="border:none;border-top:1px solid var(--line);margin:14px 0;">';

  if(!readOnly){
  html += '<div id="act_attendanceSection">';
  html += '<p class="field-label-strong" style="margin:0 0 8px;">출석 체크</p>';
  html += '<div class="card" id="act_attendanceList">';
  members.forEach(function(m){
    var checked = presentIds[m.id] ? ' selected' : '';
    html += '<div class="member-row"><span>'+escapeHtml(m.name)+roleBadgeHTML(m.role)+'</span>';
    html += '<button type="button" class="chip'+checked+'" data-member-id="'+m.id+'">'+(presentIds[m.id]?'출석':'출석체크')+'</button></div>';
  });
  html += '</div>';
  html += '</div>';
  } // !readOnly 끝 (출석체크)

  if(!readOnly){
  html += '<div id="act_prayerAnnounceSection" style="display:none;margin-top:12px;">';
  html += '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;">';
  html += '<input type="checkbox" id="act_prayerAnnounceCheck"'+(e._prayerAnnounced?' checked':'')+'> <span class="savehint">공지에 등록해서 합심기도 하기</span>';
  html += '</label>';
  html += '<div style="margin-top:8px;"><span class="field-label">만료일(선택, 비워두면 활동 날짜에 만료)</span><input type="date" id="act_prayerAnnounceExpires"></div>';
  html += '</div>';
  } // !readOnly 끝 (합심기도)

  html += '<div class="row2" style="margin-top:14px;">';
  html += '<button class="btn btn-block" id="act_cancelBtn" type="button">'+(readOnly?'닫기':'취소')+'</button>';
  if(!readOnly){
    html += '<button class="btn btn-primary btn-block" id="act_saveBtn" type="button">'+(existing?'수정 완료':'등록')+'</button>';
  }
  html += '</div>';
  if(existing && !readOnly){
    html += '<button class="btn btn-danger btn-block" id="act_deleteBtn" type="button" style="margin-top:8px;">이 활동 삭제</button>';
  }
  if(readOnly){
    html += '<p class="savehint" style="text-align:center;margin-top:10px;">다른 멤버가 등록한 활동이라 보기만 가능해요.</p>';
  }

  document.getElementById('activitySheetBody').innerHTML = html;
  openSheet('activitySheet');

  if(readOnly){
    document.getElementById('activitySheetBody').querySelectorAll('input, select, textarea, button').forEach(function(el2){
      if(el2.id === 'act_cancelBtn') return;
      el2.disabled = true;
    });
    document.getElementById('act_cancelBtn').addEventListener('click', function(){ closeSheet('activitySheet'); });
    return;
  }

  function applyPrayerModeUI(){
    var typeSelect = document.getElementById('act_type');
    var isPrayer = typeSelect && typeSelect.value === '기도요청';
    var locSection = document.getElementById('act_locationSection');
    var receiptSection = document.getElementById('act_receiptSection');
    var attSection = document.getElementById('act_attendanceSection');
    var prayerAnnounceSection = document.getElementById('act_prayerAnnounceSection');
    [locSection, receiptSection, attSection].forEach(function(sec){
      if(!sec) return;
      sec.style.display = isPrayer ? 'none' : '';
      sec.querySelectorAll('input, button, textarea').forEach(function(el2){
        if(el2.id === 'act_type') return;
        el2.disabled = isPrayer;
      });
    });
    if(prayerAnnounceSection) prayerAnnounceSection.style.display = isPrayer ? 'block' : 'none';
  }
  var typeSelectEl = document.getElementById('act_type');
  if(typeSelectEl){
    typeSelectEl.addEventListener('change', applyPrayerModeUI);
    applyPrayerModeUI();
  }

  var toggledPresent = Object.assign({}, presentIds);
  document.querySelectorAll('#act_attendanceList .chip').forEach(function(chip){
    chip.addEventListener('click', function(){
      var mid = chip.getAttribute('data-member-id');
      if(toggledPresent[mid]){ delete toggledPresent[mid]; chip.classList.remove('selected'); chip.textContent = '출석체크'; }
      else{ toggledPresent[mid] = true; chip.classList.add('selected'); chip.textContent = '출석'; }
    });
  });

  var currentReceiptImages = [e.receipt_image, e.receipt_image2].filter(Boolean);
  var currentPhotoImages = [e.photo_image, e.photo_image2, e.photo_image3].filter(Boolean);
  var currentLat = e.location_lat != null ? e.location_lat : null;
  var currentLng = e.location_lng != null ? e.location_lng : null;

  function wireImageField(prefix, getCurrent, setCurrent, inputId){
    function refresh(){
      document.getElementById(prefix+'Preview').innerHTML = imagePreviewHTML(prefix, getCurrent());
      wire();
    }
    function wire(){
      var addBtn = document.getElementById(prefix+'_addBtn');
      if(addBtn) addBtn.addEventListener('click', function(){ document.getElementById(inputId).click(); });
      var removeBtn = document.getElementById(prefix+'_removeBtn');
      if(removeBtn) removeBtn.addEventListener('click', function(){ setCurrent(null); refresh(); });
      var thumb = document.getElementById(prefix+'_thumb');
      if(thumb) thumb.addEventListener('click', function(){ openImageViewer(getCurrent()); });
    }
    wire();
    document.getElementById(inputId).addEventListener('change', function(ev){
      var file = ev.target.files[0];
      if(!file) return;
      compressImageToDataURL(file, function(dataUrl){ setCurrent(dataUrl); refresh(); });
    });
  }
  if(!readOnly){
  wireMultiImageField('act_receipt', function(){ return currentReceiptImages; }, function(v){ currentReceiptImages = v; }, 'act_receiptMultiInput', 2);
  }
  wireMultiImageField('act_photo', function(){ return currentPhotoImages; }, function(v){ currentPhotoImages = v; }, 'act_photoMultiInput', 3);

  if(!readOnly){
  document.getElementById('act_gpsBtn').addEventListener('click', function(){
    var statusEl = document.getElementById('act_gpsStatus');
    if(!navigator.geolocation){ statusEl.textContent = '이 기기/브라우저는 위치 기능을 지원하지 않아요.'; return; }
    statusEl.textContent = '위치를 확인하는 중…';
    navigator.geolocation.getCurrentPosition(function(pos){
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;
      statusEl.textContent = '현재 좌표를 담았어요('+currentLat.toFixed(4)+', '+currentLng.toFixed(4)+').';
    }, function(err){
      statusEl.textContent = '위치를 가져오지 못했어요('+err.message+'). 브라우저 위치 권한을 확인해주세요.';
    });
  });

  document.getElementById('act_mapSearchBtn').addEventListener('click', function(){
    openMapSearchSheet(function(name, lat, lng){
      document.getElementById('act_locationName').value = name || document.getElementById('act_locationName').value;
      currentLat = lat; currentLng = lng;
      document.getElementById('act_gpsStatus').textContent = '지도에서 좌표를 담았어요('+lat.toFixed(4)+', '+lng.toFixed(4)+').';
    });
  });
  }

  document.getElementById('act_cancelBtn').addEventListener('click', function(){ closeSheet('activitySheet'); });
  if(existing){
    document.getElementById('act_deleteBtn').addEventListener('click', async function(){
      await supabaseClient.from('sg_attendance').delete().eq('activity_id', existing.id);
      await supabaseClient.from('sg_activities').delete().eq('id', existing.id);
      closeSheet('activitySheet');
      await loadGroupData(currentMember.group_id);
      renderCalendarTab();
      showToast('삭제했어요.');
    });
  }

  if(!readOnly){
  document.getElementById('act_saveBtn').addEventListener('click', async function(){
    var date = document.getElementById('act_date').value;
    var title = document.getElementById('act_title').value.trim();
    var memo = document.getElementById('act_memo').value.trim();
    if(!date || !title){ showToast('날짜와 제목을 입력해주세요.'); return; }

    var activityId = existing ? existing.id : uid();
    var typeSelect = document.getElementById('act_type');
    var payload = {
      id: activityId, group_id: currentMember.group_id, date: date, title: title, memo: memo,
      activity_type: (typeSelect && typeSelect.value) ? typeSelect.value : null,
      location_name: document.getElementById('act_locationName').value.trim() || null,
      location_lat: currentLat, location_lng: currentLng,
      receipt_image: currentReceiptImages[0]||null, receipt_image2: currentReceiptImages[1]||null,
      photo_image: currentPhotoImages[0]||null, photo_image2: currentPhotoImages[1]||null, photo_image3: currentPhotoImages[2]||null
    };
    if(!existing) payload.created_by = currentMember.id;
    var res = existing
      ? await supabaseClient.from('sg_activities').update(payload).eq('id', activityId)
      : await supabaseClient.from('sg_activities').insert(payload);
    if(res.error){ showToast('저장 실패: '+res.error.message); return; }

    var isPrayerSave = payload.activity_type === '기도요청';

    if(!isPrayerSave){
      var attendanceRows = members.map(function(m){
        return { id: uid(), activity_id: activityId, member_id: m.id, present: !!toggledPresent[m.id] };
      });
      await supabaseClient.from('sg_attendance').delete().eq('activity_id', activityId);
      if(attendanceRows.length > 0){
        await supabaseClient.from('sg_attendance').insert(attendanceRows);
      }
    }

    var prayerCheck = document.getElementById('act_prayerAnnounceCheck');
    if(isPrayerSave && prayerCheck && prayerCheck.checked){
      var prayerExpiresInput = document.getElementById('act_prayerAnnounceExpires');
      var prayerExpires = (prayerExpiresInput && prayerExpiresInput.value) ? prayerExpiresInput.value : date;
      await supabaseClient.from('sg_announcements').insert({
        id: uid(), group_id: currentMember.group_id,
        content: '🙏 '+currentMember.name+'님 ['+date+'] '+title+(memo?' - '+memo:'')+' 함께 합심기도해요!',
        created_by: currentMember.id, expires_at: prayerExpires
      });
    }

    closeSheet('activitySheet');
    await loadGroupData(currentMember.group_id);
    renderCalendarTab();
    showToast(existing ? '수정했어요.' : '등록했어요.');
  });
  } // !readOnly 끝 (저장 버튼)
}

async function openDateMenu(dateIso){
  selectedCalDate = dateIso;
  var dayActivities = activities.filter(function(a){ return a.date === dateIso; });

  var readingBtnLabel = icoSpan('book')+' 성경통독';
  var plan = await loadReadingPlan(currentMember.id);
  if(plan){
    var dayIndex = daysBetweenInclusive(plan.start_date, dateIso);
    if(dayIndex >= 1 && dayIndex <= daysBetweenInclusive(plan.start_date, plan.end_date)){
      readingBtnLabel = icoSpan('book')+' '+dayIndex+'일차 성경통독 읽기';
    }
  }

  var html = '';
  html += '<p class="field-label-strong" style="margin-bottom:10px;">'+niceDate(dateIso)+'</p>';

  html += '<div class="chiprow" style="margin-bottom:14px;">';
  html += '<button class="chip" id="dm_readingBtn" type="button">'+readingBtnLabel+'</button>';
  html += '<button class="chip" id="dm_chatBtn" type="button" style="display:inline-flex;align-items:center;gap:5px;">'+icoSpan('chat',0.9)+' 오늘의 채팅</button>';
  html += '</div>';

  html += '<p class="field-label-strong">소모임 활동</p>';
  if(dayActivities.length === 0){
    html += '<p class="empty-inline">등록된 활동이 없어요.</p>';
  }else{
    dayActivities.forEach(function(a){
      var isPrayer = a.activity_type === '기도요청';
      html += '<div class="card" data-activity-open="'+a.id+'" style="cursor:pointer;">';
      html += '<p style="font-weight:700;display:flex;align-items:center;gap:5px;">'+(isPrayer?icoSpan('cross'):'')+' '+escapeHtml(a.title)+(a.activity_type?' <span class="savehint">('+escapeHtml(a.activity_type)+')</span>':'')+'</p>';
      if(a.memo) html += '<p class="savehint" style="margin-top:4px;">'+escapeHtml(a.memo)+'</p>';
      if(a.location_name) html += '<p class="savehint" style="margin-top:4px;">'+icoSpan('location',0.8)+' '+escapeHtml(a.location_name)+'</p>';
      var actPhotos = [a.photo_image, a.photo_image2, a.photo_image3].filter(Boolean);
      if(actPhotos.length > 0){
        html += '<div style="display:flex;gap:6px;margin-top:6px;">';
        actPhotos.forEach(function(p){
          html += '<img src="'+p+'" style="width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);">';
        });
        html += '</div>';
      }
      var actReceiptCount = [a.receipt_image, a.receipt_image2].filter(Boolean).length;
      if(actReceiptCount > 0) html += '<p class="savehint" style="margin-top:4px;">'+icoSpan('receipt',0.8)+' 영수증 '+actReceiptCount+'장 첨부됨</p>';
      if(isPrayer){
        var presentNames = attendance.filter(function(at){ return at.activity_id === a.id && at.present; })
          .map(function(at){ var m = members.find(function(mm){ return mm.id === at.member_id; }); return m ? m.name : null; })
          .filter(Boolean);
        if(presentNames.length > 0){
          html += '<p class="savehint" style="margin-top:6px;">'+presentNames.map(function(n){ return icoSpan('cross',0.8)+' '+escapeHtml(n); }).join(', ')+'</p>';
        }
      }
      html += '</div>';
    });
  }
  html += '<button class="btn btn-block" id="dm_addActivityBtn" type="button" style="margin-top:8px;">+ 소모임 활동 등록</button>';

  document.getElementById('genericSheetTitle').innerHTML = icoSpan('calendar')+' '+niceDate(dateIso);
  document.getElementById('genericSheetBody').innerHTML = html;
  openSheet('genericSheet');

  document.getElementById('dm_readingBtn').addEventListener('click', function(){
    closeSheet('genericSheet');
    openDailyReadingForDate(dateIso);
  });
  document.getElementById('dm_chatBtn').addEventListener('click', function(){
    closeSheet('genericSheet');
    openDailyChatScreen(dateIso);
  });
  document.getElementById('dm_addActivityBtn').addEventListener('click', function(){
    closeSheet('genericSheet');
    openActivityForm(null, dateIso);
  });
  document.querySelectorAll('[data-activity-open]').forEach(function(c){
    c.addEventListener('click', function(){
      var act = activities.find(function(x){ return x.id === c.getAttribute('data-activity-open'); });
      closeSheet('genericSheet');
      var readOnly = currentMember.role === 'member' && act.created_by !== currentMember.id;
      openActivityForm(act, dateIso, readOnly);
    });
  });
}

function saveSession(memberId){
  try{ localStorage.setItem(LOCAL_SESSION_KEY, memberId); }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem(LOCAL_SESSION_KEY); }catch(e){}
}
function getSavedSession(){
  try{ return localStorage.getItem(LOCAL_SESSION_KEY); }catch(e){ return null; }
}

async function renderLoginScreen(){
  var app = document.getElementById('app');
  groups = await loadGroups();
  var initialGroup = groups[0] || null;
  applyAppearance(initialGroup);

  var html = '';
  html += '<div class="screen" style="padding-top:60px;">';
  html += '<div style="text-align:center;margin-bottom:32px;padding:24px 16px;border-radius:16px;" id="login_logoBlock">';
  html += '<h1 style="font-size:1.625rem;display:flex;align-items:center;justify-content:center;gap:8px;'+(initialGroup&&initialGroup.logo_color?'color:'+initialGroup.logo_color+';':'')+'">'+icoSpan('pray')+' '+escapeHtml((initialGroup&&initialGroup.logo_title)||'소그룹커뮤')+'</h1>';
  html += '<p class="savehint" style="margin-top:6px;">교회 소그룹 모임 관리</p>';
  html += '</div>';

  html += '<div class="card">';
  html += '<div class="field"><span class="field-label">소그룹 선택</span><select id="login_group">';
  if(groups.length === 0){
    html += '<option value="">등록된 소그룹이 없어요</option>';
  }else{
    groups.forEach(function(g){ html += '<option value="'+g.id+'">'+escapeHtml(g.name)+'</option>'; });
  }
  html += '</select></div>';
  html += '<div class="field"><span class="field-label">이름</span><input type="text" id="login_name" placeholder="이름을 입력하세요"></div>';
  html += '<div class="field"><span class="field-label">PIN 번호</span><input type="password" id="login_pin" inputmode="numeric" placeholder="4자리 PIN"></div>';
  html += '<p class="savehint" id="login_error" style="color:var(--brick);min-height:18px;"></p>';
  html += '<button class="btn btn-primary btn-block" id="login_btn" type="button">로그인</button>';
  html += '</div>';

  if(groups.length === 0){
    html += '<button class="btn btn-block" id="login_firstSetupBtn" type="button" style="margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px;">'+icoSpan('sprout')+' 아직 소그룹이 없어요 — 처음 시작하기</button>';
  }

  html += '</div>';

  app.innerHTML = html;
  applyLoginHeaderBg(initialGroup);

  if(groups.length === 0){
    document.getElementById('login_firstSetupBtn').addEventListener('click', openFirstSetupSheet);
  }

  document.getElementById('login_group').addEventListener('change', function(){
    var g = groups.find(function(x){ return x.id === this.value; }, this);
    applyAppearance(g);
    var logoBlock = document.getElementById('login_logoBlock');
    logoBlock.querySelector('h1').innerHTML = icoSpan('pray')+' '+escapeHtml((g&&g.logo_title)||'소그룹커뮤');
    logoBlock.querySelector('h1').style.color = (g&&g.logo_color) || '';
    applyLoginHeaderBg(g);
  });

  ['login_name','login_pin'].forEach(function(fieldId){
    document.getElementById(fieldId).addEventListener('keydown', function(ev){
      if(ev.key === 'Enter'){
        ev.preventDefault();
        document.getElementById('login_btn').click();
      }
    });
  });

  document.getElementById('login_btn').addEventListener('click', async function(){
    var groupId = document.getElementById('login_group').value;
    var name = document.getElementById('login_name').value.trim();
    var pin = document.getElementById('login_pin').value.trim();
    var errEl = document.getElementById('login_error');
    if(!groupId){ errEl.textContent = '소그룹을 선택해주세요.'; return; }
    if(!name || !pin){ errEl.textContent = '이름과 PIN을 입력해주세요.'; return; }

    var res = await supabaseClient.from('sg_members').select('*').eq('group_id', groupId).eq('name', name).eq('pin', pin).limit(1);
    if(res.error || !res.data || res.data.length === 0){
      var otherGroupRes = await supabaseClient.from('sg_members').select('id').eq('name', name).eq('pin', pin).limit(1);
      if(!otherGroupRes.error && otherGroupRes.data && otherGroupRes.data.length > 0){
        errEl.textContent = '본인의 소그룹이 일치하지 않아요.';
      }else{
        errEl.textContent = '이름 또는 PIN이 일치하지 않아요.';
      }
      return;
    }
    currentMember = res.data[0];
    saveSession(currentMember.id);
    await loadGroupData(currentMember.group_id);
    activeTab = 'calendar';
    renderMainApp();
  });
}

// ---------- 초기화 ----------
async function initApp(){
  try{
    var savedId = getSavedSession();
    if(savedId){
      var res = await supabaseClient.from('sg_members').select('*').eq('id', savedId).limit(1);
      if(!res.error && res.data && res.data.length > 0){
        currentMember = res.data[0];
        await loadGroupData(currentMember.group_id);
        renderMainApp();
        return;
      }
    }
    await renderLoginScreen();
  }catch(err){
    console.error('initApp error:', err);
    document.getElementById('app').innerHTML =
      '<div class="screen" style="padding-top:80px;text-align:center;">'+
      '<div style="width:2.5rem;height:2.5rem;margin:0 auto;color:var(--brick);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5L2.5 20h19L12 3.5z"/><line x1="12" y1="10" x2="12" y2="14.5"/><circle cx="12" cy="17.2" r="0.4" fill="currentColor"/></svg></div>'+
      '<p class="field-label-strong">서버에 연결하지 못했어요.</p>'+
      '<p class="savehint" style="margin-top:8px;">인터넷 연결, 방화벽/광고차단 확장 프로그램을 확인한 뒤 새로고침 해주세요.</p>'+
      '<button class="btn btn-primary" style="margin-top:16px;" onclick="location.reload()">다시 시도</button>'+
      '</div>';
  }
}
if(supabaseClient) initApp();
</script>
