<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>소그룹커뮤 · 교회 소그룹 관리</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap');

  :root{
    --paper:#ECEAE0;
    --paper-raised:#F6F4EB;
    --ink:#20241D;
    --ink-soft:#5B6153;
    --ink-faint:#8B9081;
    --line:#C9C6B2;
    --pine:#3F6357;
    --pine-soft:#DCE5DF;
    --brick:#A8452F;
    --brick-soft:#F0DAD2;
    --olive:#8A7B4E;
    --olive-soft:#EAE3CC;
    --blue:#2B6FCB;
    --blue-soft:#DCE7F5;
    --amber:#B8791E;
    --amber-soft:#F0E0BE;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'IBM Plex Sans KR','Noto Sans KR',sans-serif;
    background:var(--paper); color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3{font-family:'Noto Serif KR',serif; margin:0;}
  input,select,textarea,button{font-family:inherit; font-size:15px;}
  input[type="text"],input[type="password"],input[type="number"],input[type="date"],select,textarea{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px;
    background:var(--paper-raised); color:var(--ink);
  }
  .app{max-width:520px; margin:0 auto; min-height:100vh; background:var(--paper); position:relative;}
  @media (min-width:900px){
    body{ background:var(--line); }
    .app{ max-width:640px; box-shadow:0 0 0 1px var(--line), 0 12px 40px rgba(0,0,0,0.12); }
  }
  @media (min-width:1200px){
    .app{ max-width:760px; }
  }
  .screen{padding:16px; padding-bottom:90px;}
  .header{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(16px + env(safe-area-inset-top)) 16px 16px; border-bottom:1px solid var(--line); background:var(--paper-raised);
    position:sticky; top:0; z-index:20;
  }
  .header h1{font-size:18px;}
  .field{margin-bottom:12px;}
  .field-label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
  .field-label-strong{font-size:14px; color:var(--ink); font-weight:700;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:11px 16px; border-radius:9px; border:1px solid var(--line);
    background:var(--paper-raised); color:var(--ink); cursor:pointer; font-weight:600;
  }
  .btn-primary{background:var(--pine); border-color:var(--pine); color:#fff;}
  .btn-danger{background:var(--brick-soft); border-color:var(--brick); color:var(--brick);}
  .btn-block{width:100%;}
  .card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:12px;
  }
  .chip{
    display:inline-flex; align-items:center; padding:8px 13px; border-radius:999px;
    border:1px solid var(--line); background:var(--paper-raised); color:var(--ink-soft);
    font-size:13.5px; cursor:pointer; font-weight:600;
  }
  .chip.selected{background:var(--pine); border-color:var(--pine); color:#fff;}
  .chiprow{display:flex; gap:8px; flex-wrap:wrap;}
  .badge{
    display:inline-flex; align-items:center; padding:3px 9px; border-radius:999px;
    font-size:11.5px; font-weight:700;
  }
  .badge-admin{background:var(--amber-soft); color:var(--amber);}
  .empty-inline{color:var(--ink-faint); font-size:13.5px; padding:14px 0;}
  .savehint{font-size:12.5px; color:var(--ink-faint); line-height:1.5;}
  .row2{display:flex; gap:8px;}
  .row2 > *{flex:1;}
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto;
    display:flex; border-top:1px solid var(--line); background:var(--paper-raised); z-index:30;
  }
  @media (min-width:900px){ .tabbar{ max-width:640px; } }
  @media (min-width:1200px){ .tabbar{ max-width:760px; } }
  .tabbar button{
    flex:1; background:none; border:none; padding:11px 4px 9px; display:flex; flex-direction:column;
    align-items:center; gap:2px; color:var(--ink-faint); font-size:11px; font-weight:600; cursor:pointer;
  }
  .tabbar button.active{color:var(--pine);}
  .tabbar button .ico{font-size:19px;}
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:80; display:none;
  }
  .overlay.open{display:block;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; max-width:520px; margin:0 auto;
    background:var(--paper); border-radius:16px 16px 0 0; z-index:90;
    max-height:88vh; overflow-y:auto; padding:18px 16px 24px;
    transform:translateY(100%); transition:transform 0.25s ease;
  }
  @media (min-width:900px){ .sheet{ max-width:640px; } }
  @media (min-width:1200px){ .sheet{ max-width:760px; } }
  .sheet.open{transform:translateY(0);}
  .sheet-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .sheet-title{font-size:17px; font-weight:700; font-family:'Noto Serif KR',serif;}
  .sheet-close{background:none; border:none; font-size:20px; color:var(--ink-faint); cursor:pointer;}
  .toast{
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:999px;
    font-size:13.5px; z-index:100; opacity:0; pointer-events:none; transition:opacity 0.2s;
  }
  .toast.show{opacity:1;}
  .announce-bar{
    background:var(--amber-soft); border:1px solid var(--amber); border-radius:10px;
    padding:10px 12px; margin-bottom:14px; font-size:13px; color:var(--ink);
  }
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center;}
  .cal-dow{font-size:11px; color:var(--ink-faint); padding:6px 0; font-weight:700;}
  .cal-cell{
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:8px; cursor:pointer; font-size:13px; position:relative; gap:2px;
  }
  .cal-cell.today{border:1.5px solid var(--pine);}
  .cal-cell.has-activity::after{
    content:''; width:5px; height:5px; border-radius:50%; background:var(--brick); position:absolute; bottom:4px;
  }
  .cal-cell .reading-done-ico{position:absolute; top:1px; right:2px; font-size:9px; line-height:1;}
  .cal-cell .prayer-ico{position:absolute; top:1px; left:2px; font-size:9px; line-height:1;}
  .cal-cell.faded{color:var(--ink-faint);}
  .cal-cell.sunday, .cal-cell.holiday{color:var(--brick); font-weight:700;}
  .cal-cell.saturday{color:var(--blue); font-weight:700;}
  .cal-dow.sunday{color:var(--brick);}
  .cal-dow.saturday{color:var(--blue);}
  .member-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line);}
  .member-row:last-child{border-bottom:none;}
  .progress-bar-bg{height:8px; background:var(--line); border-radius:4px; overflow:hidden;}
  .progress-bar-fill{height:100%; background:var(--pine);}
  .reading-carousel{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; gap:0; margin:0 -14px; scrollbar-width:none;}
  .reading-carousel::-webkit-scrollbar{display:none;}
  .reading-panel{flex:0 0 100%; scroll-snap-align:center; padding:0 14px; box-sizing:border-box;}
  .carousel-dots{display:flex; justify-content:center; gap:6px; margin-top:10px;}
  .carousel-dots .dot{width:6px; height:6px; border-radius:50%; background:var(--line); transition:background 0.2s;}
  .carousel-dots .dot.active{background:var(--pine);}
  .stat-mini-card{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:10px 6px; text-align:center; flex:1;}
  .stat-mini-card .stat-label{font-size:11px; color:var(--ink-faint); font-weight:600;}
  .stat-mini-card .stat-value{font-size:19px; font-weight:800; margin:4px 0;}
  .stat-mini-card .stat-sub{font-size:11px; color:var(--ink-faint);}
  .weekstrip-row{display:flex; justify-content:space-between; gap:4px;}
  .weekstrip-day{display:flex; flex-direction:column; align-items:center; gap:6px; flex:1;}
  .weekstrip-circle{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; background:var(--line); color:var(--ink-faint);}
  .weekstrip-circle.done{background:var(--pine); color:#fff;}
  .weekstrip-circle.today-ring{box-shadow:0 0 0 2px var(--pine);}
  .weekstrip-label{font-size:11px; color:var(--ink-faint);}
  .weekstrip-label.today-label{color:var(--pine); font-weight:700;}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="overlay" id="sheetBackdrop"></div>
<p class="toast" id="toast"></p>

<div class="sheet" id="genericSheet">
  <div class="sheet-head">
    <span class="sheet-title" id="genericSheetTitle">제목</span>
    <button class="sheet-close" type="button" onclick="closeSheet('genericSheet')">✕</button>
  </div>
  <div id="genericSheetBody"></div>
</div>

<div class="sheet" id="activitySheet">
  <div class="sheet-head">
    <span class="sheet-title" id="activitySheetTitle">소모임 활동</span>
    <button class="sheet-close" type="button" onclick="closeSheet('activitySheet')">✕</button>
  </div>
  <div id="activitySheetBody"></div>
</div>

<div class="sheet" id="mapSearchSheet" style="z-index:95;">
  <div class="sheet-head">
    <span class="sheet-title">🗺️ 장소 찾기</span>
    <button class="sheet-close" type="button" onclick="closeSheet('mapSearchSheet')">✕</button>
  </div>
  <div id="mapSearchSheetBody"></div>
</div>

<div class="sheet" id="dailyReadingSheet">
  <div class="sheet-head">
    <span class="sheet-title">📖 오늘의 통독</span>
    <button class="sheet-close" type="button" onclick="closeSheet('dailyReadingSheet')">✕</button>
  </div>
  <div id="dailyReadingSheetBody"></div>
</div>

function bskoreaReadUrl(book, chapter){
  var code = BSKOREA_BOOK_CODE[book];

}

function flattenBooks(books){
  var list = [];
  books.forEach(function(b){
    for(var c=1; c<=b[1]; c++){ list.push({book:b[0], chapter:c}); }
  });
  return list;
}

// ---------- 유틸 ----------
function uid(){ return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9); }
function isAdminRole(role){ return role === 'admin' || role === 'super_admin'; }
function roleBadgeHTML(role){
  if(role === 'super_admin') return ' <span class="badge badge-admin">👑 최고관리자</span>';
  if(role === 'admin') return ' <span class="badge badge-admin">관리자</span>';
  return '';
}
function todayStr(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function compressImageToDataURL(file, callback, maxWidthOverride){
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var maxW = maxWidthOverride || 1000;
      var scale = Math.min(1, maxW / img.width);
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

    mapSearchLeafletMap = L.map('mapsearch_mapEl').setView([37.5665, 126.9780], 12); // 기본 서울
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

    }).addTo(mapSearchLeafletMap);

    mapSearchLeafletMap.on('click', function(ev){
      placeMarker(ev.latlng.lat, ev.latlng.lng, null);
    });
  }, 50);

  function placeMarker(lat, lng, name){
    if(mapSearchMarker){ mapSearchLeafletMap.removeLayer(mapSearchMarker); }
    mapSearchMarker = L.marker([lat, lng]).addTo(mapSearchLeafletMap);
    mapSearchLeafletMap.setView([lat, lng], 16);
    selected = { name: name, lat: lat, lng: lng };
    document.getElementById('mapsearch_selectedName').textContent = name ? ('📍 '+name) : ('📍 위도 '+lat.toFixed(5)+', 경도 '+lng.toFixed(5)+' (지도를 눌러 직접 선택했어요)');
    document.getElementById('mapsearch_useBtn').style.display = 'block';
  }

  async function doSearch(){
    var q = document.getElementById('mapsearch_query').value.trim();
    if(!q) return;
    var resultsEl = document.getElementById('mapsearch_results');
    resultsEl.innerHTML = '<p class="savehint">검색 중…</p>';
    try{
      var res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=kr&q='+encodeURIComponent(q));
      var data = await res.json();
      if(!data || data.length === 0){
        resultsEl.innerHTML = '<p class="empty-inline">검색 결과가 없어요. 지도를 직접 눌러서 위치를 선택할 수도 있어요.</p>';
        return;
      }
      resultsEl.innerHTML = '';
      data.forEach(function(item, idx){
        var row = document.createElement('div');
        row.className = 'card';
        row.style.cursor = 'pointer';
        row.style.padding = '10px 12px';
        row.style.marginBottom = '6px';
        row.textContent = item.display_name;
        row.addEventListener('click', function(){
          placeMarker(parseFloat(item.lat), parseFloat(item.lon), item.display_name);
        });
        resultsEl.appendChild(row);
      });
    }catch(err){
      resultsEl.innerHTML = '<p class="empty-inline">검색 중 오류가 났어요. 지도를 직접 눌러서 위치를 선택해주세요.</p>';
    }
  }

  document.getElementById('mapsearch_btn').addEventListener('click', doSearch);
  document.getElementById('mapsearch_query').addEventListener('keydown', function(ev){
    if(ev.key === 'Enter'){ ev.preventDefault(); doSearch(); }
  });

    onSelect(selected.name, selected.lat, selected.lng);

function niceDate(dateStr){
  var d = new Date(dateStr+'T00:00:00');
  var days = ['일','월','화','수','목','금','토'];
  return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+days[d.getDay()]+')';
}
function addDays(dateStr, n){
  var d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function daysBetweenInclusive(startStr, endStr){
  var s = new Date(startStr+'T00:00:00'), e = new Date(endStr+'T00:00:00');
  return Math.round((e - s) / 86400000) + 1;
}

// ---------- 멤버 탭 ----------
var memberStatPeriodType = 'week'; // 'week' | 'month' | 'year'
var memberStatAnchor = todayStr(); // 이 날짜가 속한 주/월/연을 기준으로 봄

function getStatPeriodRange(type, anchor){
  var d = new Date(anchor+'T00:00:00');
  if(type === 'week'){
    var dow = d.getDay(); // 0=일
    var start = addDays(anchor, -dow);
    var end = addDays(anchor, 6-dow);
    var s = new Date(start+'T00:00:00'), e = new Date(end+'T00:00:00');
    var label = (s.getMonth()+1)+'.'+s.getDate()+' ~ '+(e.getMonth()+1)+'.'+e.getDate();
    return { start: start, end: end, label: label };
  }
  if(type === 'month'){
    var y = d.getFullYear(), m = d.getMonth();
    var start2 = y+'-'+String(m+1).padStart(2,'0')+'-01';
    var lastDay = new Date(y, m+1, 0).getDate();
    var end2 = y+'-'+String(m+1).padStart(2,'0')+'-'+String(lastDay).padStart(2,'0');
    return { start: start2, end: end2, label: y+'년 '+(m+1)+'월' };
  }
  // year
  var y2 = d.getFullYear();
  return { start: y2+'-01-01', end: y2+'-12-31', label: y2+'년' };
}
function shiftStatAnchor(type, dir){
  var d = new Date(memberStatAnchor+'T00:00:00');
  if(type === 'week') memberStatAnchor = addDays(memberStatAnchor, dir*7);
  else if(type === 'month') memberStatAnchor = new Date(d.getFullYear(), d.getMonth()+dir, 1).toISOString().slice(0,10);
  else memberStatAnchor = (d.getFullYear()+dir)+'-01-01';
}

function computeAttendanceStats(range){
  var relevantActivityIds = {};
  activities.forEach(function(a){
    if(!range || (a.date >= range.start && a.date <= range.end)){ relevantActivityIds[a.id] = true; }
  });
  var stats = {};
  members.forEach(function(m){ stats[m.id] = { present:0, total:0 }; });
  attendance.forEach(function(a){
    if(!stats[a.member_id]) return;
    if(!relevantActivityIds[a.activity_id]) return;
    stats[a.member_id].total++;
    if(a.present) stats[a.member_id].present++;
  });
  return stats;
}

var DONUT_COLORS = ['#3F6357','#A8452F','#B8791E','#2B6FCB','#8A7B4E','#6B4E8A','#4E8A7A','#C25B8A'];
function renderDonutSVG(dataArr, size, holeRatio){
  // dataArr: [{label, value, color}]
  size = size || 140;
  holeRatio = holeRatio || 0.6;
  var total = dataArr.reduce(function(s,d){ return s+d.value; }, 0);
  var r = size/2;
  var strokeW = r*(1-holeRatio);
  var radius = r - strokeW/2;
  var circumference = 2*Math.PI*radius;
  var offsetAcc = 0;
  var svg = '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">';
  if(total === 0){
    svg += '<circle cx="'+r+'" cy="'+r+'" r="'+radius+'" fill="none" stroke="var(--line)" stroke-width="'+strokeW+'"/>';
  }else{
    dataArr.forEach(function(d){
      if(d.value <= 0) return;
      var frac = d.value/total;
      var dash = frac*circumference;
      svg += '<circle cx="'+r+'" cy="'+r+'" r="'+radius+'" fill="none" stroke="'+d.color+'" stroke-width="'+strokeW+'" '+
        'stroke-dasharray="'+dash+' '+(circumference-dash)+'" stroke-dashoffset="'+(-offsetAcc)+'" transform="rotate(-90 '+r+' '+r+')"/>';
      offsetAcc += dash;
    });
  }
  svg += '</svg>';
  return svg;
}

// ---------- 성경통독 계산 ----------
// 시작일~종료일 사이 매일, 순서대로 성경 장(chapter)을 균등 배분해서
// 그 날 읽어야 할 범위(시작책/장 ~ 끝책/장)를 계산해요.
function computeReadingPlanDayRange(plan, dateIso){
  var books = plan.testament === 'OT' ? OT_BOOKS : (plan.testament === 'NT' ? NT_BOOKS : OT_BOOKS.concat(NT_BOOKS));
  var flat = flattenBooks(books);
  var totalChapters = flat.length;
  var totalDays = daysBetweenInclusive(plan.start_date, plan.end_date);
  if(totalDays <= 0) return null;

  var dayIndex = daysBetweenInclusive(plan.start_date, dateIso) - 1; // 0-based
  if(dayIndex < 0 || dayIndex >= totalDays) return null;

  // 각 날짜가 담당할 장의 [start,end) 인덱스 범위를 균등 배분(나머지는 앞쪽 날짜에 1장씩 더).
  var base = Math.floor(totalChapters / totalDays);
  var extra = totalChapters % totalDays;
  var startIdx = dayIndex * base + Math.min(dayIndex, extra);
  var countForDay = base + (dayIndex < extra ? 1 : 0);
  var endIdx = startIdx + countForDay;
  if(countForDay <= 0) return { chapters: [] };

  return { chapters: flat.slice(startIdx, endIdx) };
}
function testamentTotalChapters(testament){
  if(testament === 'OT') return 929;
  if(testament === 'NT') return 260;
  return 1189;
}
function formatChapterRange(chapters){
  if(!chapters || chapters.length === 0) return '오늘은 읽을 분량이 없어요.';
  var first = chapters[0], last = chapters[chapters.length-1];
  if(first.book === last.book){
    return first.chapter === last.chapter
      ? first.book+' '+first.chapter+'장'
      : first.book+' '+first.chapter+'장 ~ '+last.chapter+'장';
  }
  return first.book+' '+first.chapter+'장 ~ '+last.book+' '+last.chapter+'장';
}
// 통독 설정 저장 시점에 DB에 확정 저장해 둔 하루치 범위를 문자열로 만들어요.
// (예전에 만들어진 통독 계획이라 확정 저장된 값이 없으면, 그때만 즉석 계산으로 보완해요.)
function formatStoredRange(progressRow, plan){
  if(progressRow && progressRow.range_start_book){
    return formatChapterRange([
      { book: progressRow.range_start_book, chapter: progressRow.range_start_chapter },
      { book: progressRow.range_end_book, chapter: progressRow.range_end_chapter }
    ]);
  }
  if(plan){
    var range = computeReadingPlanDayRange(plan, progressRow ? progressRow.date : null);
    return formatChapterRange(range ? range.chapters : []);
  }
  return '오늘은 읽을 분량이 없어요.';
}
function getStoredStartChapter(progressRow, plan, dateIso){
  if(progressRow && progressRow.range_start_book){
    return { book: progressRow.range_start_book, chapter: progressRow.range_start_chapter };
  }
  var range = computeReadingPlanDayRange(plan, dateIso);
  return range && range.chapters[0] ? range.chapters[0] : null;
}

async function renderMyTab(){
  var el = document.getElementById('tabContent');
  var plan = await loadReadingPlan(currentMember.id);
  var progress = plan ? await loadReadingProgress(plan.id) : [];
  var completedCount = progress.filter(function(p){ return p.completed; }).length;
  var totalDays = plan ? daysBetweenInclusive(plan.start_date, plan.end_date) : 0;
  var pct = totalDays > 0 ? Math.round(completedCount/totalDays*100) : 0;

  var html = '<div class="screen">';
  html += '<div class="card">';
  html += '<p class="field-label-strong">🙋 '+escapeHtml(currentMember.name)+'님</p>';
  html += '<button class="btn btn-block" id="my_pinBtn" type="button" style="margin-top:10px;">🔒 비밀번호(PIN) 변경</button>';
  html += '</div>';

  html += '<div class="card">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;">';
  html += '<p class="field-label-strong">📖 성경통독</p>';
  html += '<button class="chip" id="my_readingSetBtn" type="button">'+(plan?'설정 변경':'통독 설정하기')+'</button>';
  html += '</div>';

  if(plan){
    var testamentLabel = plan.testament==='OT' ? '구약' : (plan.testament==='NT' ? '신약' : '구약+신약 전체');
    html += '<p class="savehint" style="margin-top:8px;">'+testamentLabel+' · '+plan.start_date+' ~ '+plan.end_date+'</p>';

    // ---- 진행상태 계산 ----
    var daysElapsed = Math.max(1, daysBetweenInclusive(plan.start_date, todayStr()));
    var diff = daysElapsed - completedCount; // 양수=느림, 음수=빠름, 0=정상
    var paceRate = daysElapsed > 0 ? (completedCount / daysElapsed) : 0;
    var remainingUnits = Math.max(0, totalDays - completedCount);
    var expectedCompletionText;
    if(completedCount >= totalDays){
      expectedCompletionText = '완독 완료! 🎉';
    }else if(paceRate <= 0){
      expectedCompletionText = '계산 불가';
    }else{
      var addlDays = Math.ceil(remainingUnits / paceRate);
      expectedCompletionText = addDays(todayStr(), addlDays);
    }
    var completedDatesSet = {};
    progress.forEach(function(p){ if(p.completed) completedDatesSet[p.date] = true; });
    var lastCompletedDate = null;
    Object.keys(completedDatesSet).sort().forEach(function(d){ lastCompletedDate = d; });
    var daysSinceLastRead = lastCompletedDate ? daysBetweenInclusive(lastCompletedDate, todayStr()) - 1 : daysElapsed - 1;

    html += '<div class="reading-carousel" id="readingCarousel">';

    // 패널 1: 통계 카드 3개
    html += '<div class="reading-panel"><div style="display:flex;gap:8px;">';
    html += '<div class="stat-mini-card"><p class="stat-label">진행중</p><p class="stat-value">'+daysElapsed+'</p><p class="stat-sub">일차 / '+totalDays+'일</p></div>';
    html += '<div class="stat-mini-card"><p class="stat-label">읽은 날</p><p class="stat-value" style="color:'+(diff>0?'var(--amber)':'var(--pine)')+';">'+completedCount+'</p><p class="stat-sub">'+(diff>0?diff+'일 느림':(diff<0?(-diff)+'일 빠름':'정상 진행')) +'</p></div>';
    html += '<div class="stat-mini-card"><p class="stat-label">📅 예상완독일</p><p class="stat-value" style="font-size:15px;">'+expectedCompletionText+'</p></div>';
    html += '</div></div>';

    // 패널 2: 자전거 진행바
    html += '<div class="reading-panel">';
    html += '<div style="margin:8px 0 6px;position:relative;height:26px;">';
    html += '<div class="progress-bar-bg" style="position:absolute;top:9px;left:0;right:0;"><div class="progress-bar-fill" style="width:'+pct+'%;"></div></div>';
    html += '<span style="position:absolute;top:0;left:calc('+pct+'% - 11px);font-size:20px;transition:left 0.3s;">🚴</span>';
    html += '</div>';
    html += '<p class="savehint" style="text-align:center;"><b style="color:var(--amber);">나 '+completedCount+'일</b> / 오늘 '+daysElapsed+'일차</p>';
    html += '<p class="savehint" style="text-align:center;">목표기간 : '+plan.start_date+' ~ '+plan.end_date+'</p>';
    html += '</div>';

    // 패널 3: 안읽은지 N일 지남 경고 (또는 잘하고 있어요 메시지)
    html += '<div class="reading-panel"><div style="display:flex;align-items:center;gap:12px;">';
    if(daysSinceLastRead >= 1){
      html += '<div><p style="font-weight:800;color:var(--brick);font-size:16px;">안 읽은지 '+daysSinceLastRead+'일 지났습니다.</p>';
      html += '<p class="savehint" style="margin-top:4px;">오늘부터 다시 시작하는 마음으로!!</p></div>';
      html += '<span style="font-size:40px;">😢</span>';
    }else{
      html += '<div><p style="font-weight:800;color:var(--pine);font-size:16px;">오늘도 통독을 완료했어요!</p>';
      html += '<p class="savehint" style="margin-top:4px;">꾸준함이 최고예요 👏</p></div>';
      html += '<span style="font-size:40px;">🎉</span>';
    }
    html += '</div></div>';

    // 패널 4: 최근 7일 스트립
    html += '<div class="reading-panel">';
    html += '<p class="field-label-strong" style="text-align:center;margin-bottom:12px;">최근 7일 통독 기록</p>';
    html += '<div class="weekstrip-row">';
    var dowNames = ['주일','월','화','수','목','금','토'];
    for(var wi=6; wi>=0; wi--){
      var wd = addDays(todayStr(), -wi);
      var wdate = new Date(wd+'T00:00:00');
      var isToday = wi === 0;
      var wdone = !!completedDatesSet[wd];
      html += '<div class="weekstrip-day">';
      html += '<div class="weekstrip-circle'+(wdone?' done':'')+(isToday?' today-ring':'')+'">'+wdate.getDate()+'</div>';
      html += '<span class="weekstrip-label'+(isToday?' today-label':'')+'">'+(isToday?'오늘':dowNames[wdate.getDay()])+'</span>';
      html += '</div>';
    }
    html += '</div></div>';

    html += '</div>'; // .reading-carousel
    html += '<div class="carousel-dots" id="readingCarouselDots">';
    for(var di=0; di<4; di++){ html += '<span class="dot'+(di===0?' active':'')+'" data-dot="'+di+'"></span>'; }
    html += '</div>';

    html += '<p class="field-label-strong" style="margin-top:14px;">통독 현황표</p>';
    var completedDates = {};
    var progressRowsByDate = {};
    progress.forEach(function(p){
      progressRowsByDate[p.date] = p;
      if(p.completed) completedDates[p.date] = true;
    });

    // 날짜를 월별로 묶어요.
    var monthGroups = {}; // 'YYYY-MM' -> [dateStr, ...]
    var monthOrder = [];
    for(var i=0; i<totalDays; i++){
      var d = addDays(plan.start_date, i);
      var ym = d.slice(0,7);
      if(!monthGroups[ym]){ monthGroups[ym] = []; monthOrder.push(ym); }
      monthGroups[ym].push(d);
    }
    // 기본으로 오늘이 속한 달(통독 기간 안이면)을 펼쳐둬요.
    var todayYm = todayStr().slice(0,7);
    if(monthGroups[todayYm] && expandedReadingMonths[todayYm] === undefined){ expandedReadingMonths[todayYm] = true; }

    monthOrder.forEach(function(ym){
      var days = monthGroups[ym];
      var doneInMonth = days.filter(function(d){ return completedDates[d]; }).length;
      var expanded = !!expandedReadingMonths[ym];
      var yLabel = ym.slice(0,4)+'년 '+parseInt(ym.slice(5,7),10)+'월';
      html += '<div class="card" style="margin-top:8px;padding:10px 12px;">';
      html += '<div data-month-toggle="'+ym+'" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;">';
      html += '<span style="font-weight:700;">'+yLabel+'</span>';
      html += '<span class="savehint">'+doneInMonth+'/'+days.length+'일 '+(expanded?'▲':'▼')+'</span>';
      html += '</div>';
      if(expanded){
        html += '<div style="margin-top:8px;">';
        days.forEach(function(d){
          var done = !!completedDates[d];
          var row = progressRowsByDate[d];
          html += '<div class="member-row"><span>'+niceDate(d)+' · '+formatStoredRange(row, plan)+'</span>';
          html += '<span style="'+(done?'color:var(--pine);font-weight:700;':'color:var(--ink-faint);')+'">'+(done?'✅':'—')+'</span></div>';
        });
        html += '</div>';
      }
      html += '</div>';
    });
  }else{
    html += '<p class="empty-inline">아직 통독 설정을 안 하셨어요.</p>';
  }
  html += '</div></div>';

  el.innerHTML = html;

  document.getElementById('my_pinBtn').addEventListener('click', openChangePinSheet);
  document.getElementById('my_readingSetBtn').addEventListener('click', function(){ openReadingSettingsSheet(plan); });
  document.querySelectorAll('[data-month-toggle]').forEach(function(header){

    var dots = document.querySelectorAll('#readingCarouselDots .dot');

      var idx = Math.round(carouselEl.scrollLeft / carouselEl.clientWidth);
      dots.forEach(function(d, i){ d.classList.toggle('active', i === idx); });
    });
  }
}

    var end = document.getElementById('rp_end').value;
    if(!start || !end || end < start){ showToast('올바른 시작일/종료일을 선택해주세요.'); return; }

    var planId = uid();
    var payload = { id: planId, member_id: currentMember.id, testament: selectedTestament, start_date: start, end_date: end };
    var res = await supabaseClient.from('sg_reading_plans').insert(payload);
    if(res.error){ showToast('저장 실패: '+res.error.message); return; }

    // 이 시점에 매일의 장절 범위를 확정해서 저장해요. 나중에 설정을 다시 바꿔도
    // 이미 확정된(과거) 날짜의 장절은 절대 바뀌지 않아요.
    var totalDaysNew = daysBetweenInclusive(start, end);
    var progressRows = [];
    for(var i=0; i<totalDaysNew; i++){
      var d = addDays(start, i);
      var range = computeReadingPlanDayRange(payload, d);
      var chapters = range ? range.chapters : [];
      var first = chapters[0], last = chapters[chapters.length-1];
      progressRows.push({
        id: uid(), plan_id: planId, date: d, completed: false,
        range_start_book: first ? first.book : null, range_start_chapter: first ? first.chapter : null,
        range_end_book: last ? last.book : null, range_end_chapter: last ? last.chapter : null
      });
    }
    if(progressRows.length > 0){
      var progRes = await supabaseClient.from('sg_reading_progress').insert(progressRows);
      if(progRes.error){ showToast('통독 일정 생성 실패: '+progRes.error.message); return; }
    }

    closeSheet('genericSheet');
    showToast('통독 설정이 저장됐어요.');
    renderMyTab();
  });
}

async function openDailyReadingForDate(dateIso){
  var plan = await loadReadingPlan(currentMember.id);
  var html = '';
  if(!plan){
    html += '<p class="empty-inline">먼저 마이메뉴에서 성경통독 설정을 해주세요.</p>';
    document.getElementById('dailyReadingSheetBody').innerHTML = html;
    openSheet('dailyReadingSheet');
    return;
  }
  var progress = await loadReadingProgress(plan.id);
  var existingRow = progress.find(function(p){ return p.date === dateIso; });
  var done = existingRow && existingRow.completed;

  // 통독 설정을 저장할 때 이미 이 날짜의 범위가 확정 저장돼 있으면 그 값을 써요
  // (나중에 설정을 바꿔도 안 바뀌게). 레거시 계획이라 저장된 값이 없으면 그때만 즉석 계산해요.
  var chapters;
  if(existingRow && existingRow.range_start_book){
    chapters = [
      { book: existingRow.range_start_book, chapter: existingRow.range_start_chapter },
      { book: existingRow.range_end_book, chapter: existingRow.range_end_chapter }
    ];
  }else{
    var liveRange = computeReadingPlanDayRange(plan, dateIso);
    if(!liveRange){
      html += '<p class="empty-inline">'+niceDate(dateIso)+'은(는) 통독 기간(' +plan.start_date+' ~ '+plan.end_date+') 밖이에요.</p>';
      document.getElementById('dailyReadingSheetBody').innerHTML = html;
      openSheet('dailyReadingSheet');
      return;
    }
    chapters = liveRange.chapters;
  }

  html += '<p class="field-label-strong">'+niceDate(dateIso)+'</p>';
  html += '<div class="card" style="text-align:center;margin-top:10px;">';
  html += '<p style="font-size:20px;font-weight:700;font-family:\'Noto Serif KR\',serif;">'+formatChapterRange(chapters)+'</p>';
  html += '</div>';

  var startChapter = chapters[0];
  if(startChapter){
    var groupRes2 = await supabaseClient.from('sg_groups').select('bible_reading_mode').eq('id', currentMember.group_id).limit(1);
    var readingMode = (groupRes2.data && groupRes2.data[0] && groupRes2.data[0].bible_reading_mode) || 'bskorea';
    var readUrl = readingMode === 'youversion'
      ? youversionReadUrl(startChapter.book, startChapter.chapter)
      : bskoreaReadUrl(startChapter.book, startChapter.chapter);
    var linkLabel = readingMode === 'youversion' ? '📖 성경읽기 (유버전)' : '📖 대한성서공회에서 말씀 읽기';
    if(readUrl){
      html += '<a href="'+readUrl+'" target="_blank" rel="noopener" class="btn btn-block" style="margin-bottom:8px;text-decoration:none;">'+linkLabel+'</a>';
      html += '<p class="savehint" style="text-align:center;margin-bottom:8px;">'+escapeHtml(startChapter.book)+' '+startChapter.chapter+'장부터 열려요. 이후 장은 그 페이지 안에서 넘겨서 읽으세요.</p>';
    }
  }

  if(done){
    html += '<div class="card" style="text-align:center;background:var(--pine-soft);border-color:var(--pine);"><p style="font-weight:700;color:var(--pine);">✅ 읽기 완료!</p></div>';
  }else{
    html += '<button class="btn btn-primary btn-block" id="dr_completeBtn" type="button" style="margin-top:8px;">읽기 완료</button>';
  }

  document.getElementById('dailyReadingSheetBody').innerHTML = html;
  openSheet('dailyReadingSheet');

  if(!done){
    document.getElementById('dr_completeBtn').addEventListener('click', async function(){
      var first = chapters[0], last = chapters[chapters.length-1];
      var rangeFields = {
        range_start_book: first.book, range_start_chapter: first.chapter,
        range_end_book: last.book, range_end_chapter: last.chapter
      };
      var payload = existingRow
        ? Object.assign({ completed: true, completed_at: new Date().toISOString() }, rangeFields)
        : Object.assign({ id: uid(), plan_id: plan.id, date: dateIso, completed: true, completed_at: new Date().toISOString() }, rangeFields);
      var res = existingRow
        ? await supabaseClient.from('sg_reading_progress').update(payload).eq('id', existingRow.id)
        : await supabaseClient.from('sg_reading_progress').insert(payload);
      if(res.error){ showToast('저장 실패: '+res.error.message); return; }
      showToast('오늘의 통독을 완료했어요! 🎉');
      openDailyReadingForDate(dateIso);
    });
  }
}

// ---------- 캘린더 탭 ----------
async function renderCalendarTab(){
  var el = document.getElementById('tabContent');

  // 이번 달에 통독 완료한 날짜들을 미리 조회해서 캘린더에 표시해요.
  var completedReadingDates = {};
  var plan = await loadReadingPlan(currentMember.id);
  if(plan){
    var progress = await loadReadingProgress(plan.id);
    progress.forEach(function(p){ if(p.completed) completedReadingDates[p.date] = true; });
  }

  var html = '<div class="screen">';

  var todayMD = todayStr().slice(5); // 'MM-DD'
  var birthdayMembers = members.filter(function(m){ return m.birthday && m.birthday.slice(5) === todayMD; });
  birthdayMembers.forEach(function(m){
    html += '<div class="announce-bar" style="background:var(--pine-soft);border-color:var(--pine);">🎂 오늘은 '+escapeHtml(m.name)+'님 생일이에요! 축하해주세요 🎉</div>';
  });

  if(announcements.length > 0){
    announcements.slice(0,3).forEach(function(a){
      html += '<div class="announce-bar">📢 '+escapeHtml(a.content)+'</div>';
    });
  }

  html += '<div class="card">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">';
  html += '<button class="btn" id="cal_prevBtn" type="button" style="padding:6px 10px;">‹</button>';
  html += '<h2 style="font-size:16px;">'+calYear+'년 '+calMonth+'월</h2>';
  html += '<div style="display:flex;gap:6px;">';
  html += '<button class="btn" id="cal_todayBtn" type="button" style="padding:6px 10px;" aria-label="오늘로 이동">📅</button>';
  html += '<button class="btn" id="cal_nextBtn" type="button" style="padding:6px 10px;">›</button>';
  html += '</div></div>';

  html += '<div class="cal-grid">';
  ['일','월','화','수','목','금','토'].forEach(function(d,idx){
    var dowCls = idx===0?' sunday':(idx===6?' saturday':'');
    html += '<div class="cal-dow'+dowCls+'">'+d+'</div>';
  });

  var firstDay = new Date(calYear, calMonth-1, 1);
  var startWeekday = firstDay.getDay();
  var daysInMonth = new Date(calYear, calMonth, 0).getDate();
  var todayIso = todayStr();

  for(var i=0; i<startWeekday; i++){ html += '<div></div>'; }
  for(var d=1; d<=daysInMonth; d++){
    var iso = calYear+'-'+String(calMonth).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var weekday = new Date(calYear, calMonth-1, d).getDay();
    var holidayName = getHolidayName(iso);
    var hasActivity = activities.some(function(a){ return a.date === iso; });
    var hasPrayer = activities.some(function(a){ return a.date === iso && a.activity_type === '기도요청'; });
    var cls = 'cal-cell';
    if(iso===todayIso) cls += ' today';
    if(hasActivity) cls += ' has-activity';
    if(holidayName) cls += ' holiday';
    else if(weekday===0) cls += ' sunday';
    else if(weekday===6) cls += ' saturday';
    html += '<div class="'+cls+'" data-date="'+iso+'"'+(holidayName?' title="'+escapeHtml(holidayName)+'"':'')+'>';
    html += d;
    if(hasPrayer) html += '<span class="prayer-ico">✝️</span>';
    if(completedReadingDates[iso]) html += '<span class="reading-done-ico">📖</span>';
    html += '</div>';
  }
  html += '</div></div>';
  html += '</div>';

  el.innerHTML = html;

  document.getElementById('cal_prevBtn').addEventListener('click', function(){
    calMonth--; if(calMonth < 1){ calMonth = 12; calYear--; }
    renderCalendarTab();
  });
  document.getElementById('cal_nextBtn').addEventListener('click', function(){
    calMonth++; if(calMonth > 12){ calMonth = 1; calYear++; }
    renderCalendarTab();
  });
  document.getElementById('cal_todayBtn').addEventListener('click', function(){
    var now = new Date();
    calYear = now.getFullYear(); calMonth = now.getMonth()+1;
    renderCalendarTab();
  });
  el.querySelectorAll('.cal-cell[data-date]').forEach(function(cell){
    cell.addEventListener('click', function(){
      openDateMenu(cell.getAttribute('data-date'));
    });
  });
}

// ---------- 소모임 활동 등록 / 출석 체크 ----------
function openActivityForm(existing, dateIso){
  var e = existing || {};
  document.getElementById('activitySheetTitle').textContent = existing ? '✏️ 소모임 활동 수정' : '➕ 소모임 활동 등록';

  var existingAttendance = existing ? attendance.filter(function(a){ return a.activity_id === existing.id; }) : [];
  var presentIds = {};
  existingAttendance.forEach(function(a){ if(a.present) presentIds[a.member_id] = true; });

  var html = '';
  html += '<div class="field"><span class="field-label">날짜</span><input type="date" id="act_date" value="'+(e.date||dateIso)+'"></div>';
  html += '<div class="field"><span class="field-label">제목</span><input type="text" id="act_title" placeholder="예: 정기 소모임" value="'+escapeHtml(e.title||'')+'"></div>';
  if(activityTypes.length > 0){
    html += '<div class="field"><span class="field-label">활동 항목(선택)</span><select id="act_type">';
    html += '<option value="">선택 안 함</option>';
    activityTypes.forEach(function(t){
      html += '<option value="'+escapeHtml(t.name)+'"'+(e.activity_type===t.name?' selected':'')+'>'+(t.name==='기도요청'?'✝️ ':'')+escapeHtml(t.name)+'</option>';
    });
    html += '</select></div>';
  }
  html += '<div class="field"><span class="field-label">메모</span><textarea id="act_memo" rows="2" placeholder="선택 입력">'+escapeHtml(e.memo||'')+'</textarea></div>';

  html += '<div id="act_locationSection">';
  html += '<div class="field"><span class="field-label">장소</span>';
  html += '<div class="row2"><input type="text" id="act_locationName" placeholder="예: 은혜교회 3층 소모임실" value="'+escapeHtml(e.location_name||'')+'" style="flex:2;">';
  html += '<button type="button" class="btn" id="act_mapSearchBtn" style="flex:1;">🗺️ 지도에서 찾기</button></div></div>';
  html += '<button type="button" class="btn" id="act_gpsBtn" style="width:100%;margin-bottom:6px;">📍 현재 위치로 지도 좌표 담기</button>';
  html += '<p class="savehint" id="act_gpsStatus" style="margin-bottom:12px;">'+(e.location_lat?'현재 좌표가 담겨 있어요('+e.location_lat.toFixed(4)+', '+e.location_lng.toFixed(4)+').':'좌표를 담으면 지도로 바로 열어볼 수 있어요.')+'</p>';
  html += '</div>';

  html += '<div id="act_receiptSection">';
  html += '<div class="field"><span class="field-label">영수증 사진 (선택)</span>';
  html += '<input type="file" accept="image/*" id="act_receiptInput" style="display:none;">';
  html += '<div id="act_receiptPreview">'+imagePreviewHTML('act_receipt', e.receipt_image)+'</div></div>';
  html += '</div>';

  html += '<div class="field"><span class="field-label">활동 사진 (선택)</span>';
  html += '<input type="file" accept="image/*" id="act_photoInput" style="display:none;">';
  html += '<div id="act_photoPreview">'+imagePreviewHTML('act_photo', e.photo_image)+'</div></div>';

  html += '<div id="act_attendanceSection">';
  html += '<p class="field-label-strong" style="margin:14px 0 8px;">출석 체크</p>';
  html += '<div class="card" id="act_attendanceList">';
  members.forEach(function(m){
    var checked = presentIds[m.id] ? ' selected' : '';
    html += '<div class="member-row"><span>'+escapeHtml(m.name)+roleBadgeHTML(m.role)+'</span>';
    html += '<button type="button" class="chip'+checked+'" data-member-id="'+m.id+'">'+(presentIds[m.id]?'출석':'출석체크')+'</button></div>';
  });
  html += '</div>';
  html += '</div>';

  html += '<div id="act_prayerAnnounceSection" style="display:none;margin-top:12px;">';
  html += '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;">';
  html += '<input type="checkbox" id="act_prayerAnnounceCheck"'+(e._prayerAnnounced?' checked':'')+'> <span class="savehint">공지에 등록해서 합심기도 하기</span>';
  html += '</label></div>';

  html += '<div class="row2" style="margin-top:14px;">';
  html += '<button class="btn btn-block" id="act_cancelBtn" type="button">취소</button>';
  html += '<button class="btn btn-primary btn-block" id="act_saveBtn" type="button">'+(existing?'수정 완료':'등록')+'</button>';
  html += '</div>';
  if(existing){
    html += '<button class="btn btn-danger btn-block" id="act_deleteBtn" type="button" style="margin-top:8px;">이 활동 삭제</button>';
  }

  document.getElementById('activitySheetBody').innerHTML = html;
  openSheet('activitySheet');

  function applyPrayerModeUI(){
    var typeSelect = document.getElementById('act_type');
    var isPrayer = typeSelect && typeSelect.value === '기도요청';
    var locSection = document.getElementById('act_locationSection');
    var receiptSection = document.getElementById('act_receiptSection');
    var attSection = document.getElementById('act_attendanceSection');
    var prayerAnnounceSection = document.getElementById('act_prayerAnnounceSection');
    [locSection, receiptSection, attSection].forEach(function(sec){
      if(!sec) return;
      sec.style.opacity = isPrayer ? '0.4' : '1';
      sec.querySelectorAll('input, button, textarea').forEach(function(el2){
        if(el2.id === 'act_type') return;
        el2.disabled = isPrayer;
      });
    });
    if(prayerAnnounceSection) prayerAnnounceSection.style.display = isPrayer ? 'block' : 'none';
  }
  var typeSelectEl = document.getElementById('act_type');
  if(typeSelectEl){
    typeSelectEl.addEventListener('change', applyPrayerModeUI);
    applyPrayerModeUI();
  }

  var toggledPresent = Object.assign({}, presentIds);
  document.querySelectorAll('#act_attendanceList .chip').forEach(function(chip){
    chip.addEventListener('click', function(){
      var mid = chip.getAttribute('data-member-id');
      if(toggledPresent[mid]){ delete toggledPresent[mid]; chip.classList.remove('selected'); chip.textContent = '출석체크'; }
      else{ toggledPresent[mid] = true; chip.classList.add('selected'); chip.textContent = '출석'; }
    });
  });

  var currentReceiptImage = e.receipt_image || null;
  var currentPhotoImage = e.photo_image || null;
  var currentLat = e.location_lat != null ? e.location_lat : null;
  var currentLng = e.location_lng != null ? e.location_lng : null;

  function wireImageField(prefix, getCurrent, setCurrent, inputId){
    function refresh(){
      document.getElementById(prefix+'Preview').innerHTML = imagePreviewHTML(prefix, getCurrent());
      wire();
    }
    function wire(){
      var addBtn = document.getElementById(prefix+'_addBtn');
      if(addBtn) addBtn.addEventListener('click', function(){ document.getElementById(inputId).click(); });
      var removeBtn = document.getElementById(prefix+'_removeBtn');
      if(removeBtn) removeBtn.addEventListener('click', function(){ setCurrent(null); refresh(); });
      var thumb = document.getElementById(prefix+'_thumb');
      if(thumb) thumb.addEventListener('click', function(){ openImageViewer(getCurrent()); });
    }
    wire();
    document.getElementById(inputId).addEventListener('change', function(ev){
      var file = ev.target.files[0];
      if(!file) return;
      compressImageToDataURL(file, function(dataUrl){ setCurrent(dataUrl); refresh(); });
    });
  }
  wireImageField('act_receipt', function(){ return currentReceiptImage; }, function(v){ currentReceiptImage = v; }, 'act_receiptInput');
  wireImageField('act_photo', function(){ return currentPhotoImage; }, function(v){ currentPhotoImage = v; }, 'act_photoInput');

  document.getElementById('act_gpsBtn').addEventListener('click', function(){
    var statusEl = document.getElementById('act_gpsStatus');
    if(!navigator.geolocation){ statusEl.textContent = '이 기기/브라우저는 위치 기능을 지원하지 않아요.'; return; }
    statusEl.textContent = '위치를 확인하는 중…';
    navigator.geolocation.getCurrentPosition(function(pos){
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;
      statusEl.textContent = '현재 좌표를 담았어요('+currentLat.toFixed(4)+', '+currentLng.toFixed(4)+').';
    }, function(err){
      statusEl.textContent = '위치를 가져오지 못했어요('+err.message+'). 브라우저 위치 권한을 확인해주세요.';
    });
  });

  document.getElementById('act_mapSearchBtn').addEventListener('click', function(){
    openMapSearchSheet(function(name, lat, lng){
      document.getElementById('act_locationName').value = name || document.getElementById('act_locationName').value;
      currentLat = lat; currentLng = lng;
      document.getElementById('act_gpsStatus').textContent = '지도에서 좌표를 담았어요('+lat.toFixed(4)+', '+lng.toFixed(4)+').';
    });
  });

  document.getElementById('act_cancelBtn').addEventListener('click', function(){ closeSheet('activitySheet'); });
  if(existing){
    document.getElementById('act_deleteBtn').addEventListener('click', async function(){
      await supabaseClient.from('sg_attendance').delete().eq('activity_id', existing.id);
      await supabaseClient.from('sg_activities').delete().eq('id', existing.id);
      closeSheet('activitySheet');
      await loadGroupData(currentMember.group_id);
      renderCalendarTab();
      showToast('삭제했어요.');
    });
  }

  document.getElementById('act_saveBtn').addEventListener('click', async function(){
    var date = document.getElementById('act_date').value;
    var title = document.getElementById('act_title').value.trim();
    var memo = document.getElementById('act_memo').value.trim();
    if(!date || !title){ showToast('날짜와 제목을 입력해주세요.'); return; }

    var activityId = existing ? existing.id : uid();
    var typeSelect = document.getElementById('act_type');
    var payload = {
      id: activityId, group_id: currentMember.group_id, date: date, title: title, memo: memo,
      activity_type: (typeSelect && typeSelect.value) ? typeSelect.value : null,
      location_name: document.getElementById('act_locationName').value.trim() || null,
      location_lat: currentLat, location_lng: currentLng,
      receipt_image: currentReceiptImage, photo_image: currentPhotoImage
    };
    var res = existing
      ? await supabaseClient.from('sg_activities').update(payload).eq('id', activityId)
      : await supabaseClient.from('sg_activities').insert(payload);
    if(res.error){ showToast('저장 실패: '+res.error.message); return; }

    var isPrayerSave = payload.activity_type === '기도요청';

    // 출석 upsert (기도요청은 출석체크 항목 자체를 비활성화했으니 건너뛰어요)
    if(!isPrayerSave){
      var attendanceRows = members.map(function(m){
        return { id: uid(), activity_id: activityId, member_id: m.id, present: !!toggledPresent[m.id] };
      });
      await supabaseClient.from('sg_attendance').delete().eq('activity_id', activityId);
      if(attendanceRows.length > 0){
        await supabaseClient.from('sg_attendance').insert(attendanceRows);
      }
    }

    // 기도요청 + "공지에 등록해서 합심기도 하기" 체크 시 공지 자동 생성
    var prayerCheck = document.getElementById('act_prayerAnnounceCheck');
    if(isPrayerSave && prayerCheck && prayerCheck.checked){
      await supabaseClient.from('sg_announcements').insert({
        id: uid(), group_id: currentMember.group_id,
        content: '🙏 ['+date+'] '+title+(memo?' - '+memo:'')+' 함께 합심기도해요!',
        created_by: currentMember.id, expires_at: date
      });
    }

    closeSheet('activitySheet');
    await loadGroupData(currentMember.group_id);
    renderCalendarTab();
    showToast(existing ? '수정했어요.' : '등록했어요.');
  });
}

async function openDateMenu(dateIso){
  selectedCalDate = dateIso;
  var dayActivities = activities.filter(function(a){ return a.date === dateIso; });

  var readingBtnLabel = '📖 성경통독';
  var plan = await loadReadingPlan(currentMember.id);
  if(plan){
    var dayIndex = daysBetweenInclusive(plan.start_date, dateIso);
    if(dayIndex >= 1 && dayIndex <= daysBetweenInclusive(plan.start_date, plan.end_date)){
      readingBtnLabel = '📖 '+dayIndex+'일차 성경통독 읽기';
    }
  }

  var html = '';
  html += '<p class="field-label-strong" style="margin-bottom:10px;">'+niceDate(dateIso)+'</p>';

  html += '<div class="chiprow" style="margin-bottom:14px;">';
  html += '<button class="chip" id="dm_readingBtn" type="button">'+readingBtnLabel+'</button>';
  html += '</div>';

  html += '<p class="field-label-strong">소모임 활동</p>';
  if(dayActivities.length === 0){
    html += '<p class="empty-inline">등록된 활동이 없어요.</p>';
  }else{
    dayActivities.forEach(function(a){
      var isPrayer = a.activity_type === '기도요청';
      html += '<div class="card" data-activity-open="'+a.id+'" style="cursor:pointer;">';
      html += '<p style="font-weight:700;">'+(isPrayer?'✝️ ':'')+escapeHtml(a.title)+(a.activity_type?' <span class="savehint">('+escapeHtml(a.activity_type)+')</span>':'')+'</p>';
      if(a.memo) html += '<p class="savehint" style="margin-top:4px;">'+escapeHtml(a.memo)+'</p>';
      if(a.location_name) html += '<p class="savehint" style="margin-top:4px;">📍 '+escapeHtml(a.location_name)+'</p>';
      if(a.photo_image) html += '<img src="'+a.photo_image+'" style="width:64px;height:64px;object-fit:cover;border-radius:8px;margin-top:6px;border:1px solid var(--line);">';
      if(a.receipt_image) html += '<p class="savehint" style="margin-top:4px;">🧾 영수증 첨부됨</p>';
      if(isPrayer){
        var presentNames = attendance.filter(function(at){ return at.activity_id === a.id && at.present; })
          .map(function(at){ var m = members.find(function(mm){ return mm.id === at.member_id; }); return m ? m.name : null; })
          .filter(Boolean);
        if(presentNames.length > 0){
          html += '<p class="savehint" style="margin-top:6px;">'+presentNames.map(function(n){ return '✝️ '+escapeHtml(n); }).join(', ')+'</p>';
        }
      }
      html += '</div>';
    });
  }
  html += '<button class="btn btn-block" id="dm_addActivityBtn" type="button" style="margin-top:8px;">+ 소모임 활동 등록</button>';

  document.getElementById('genericSheetTitle').textContent = '📅 '+niceDate(dateIso);
  document.getElementById('genericSheetBody').innerHTML = html;
  openSheet('genericSheet');

  document.getElementById('dm_readingBtn').addEventListener('click', function(){
    closeSheet('genericSheet');
    openDailyReadingForDate(dateIso);
  });
  document.getElementById('dm_addActivityBtn').addEventListener('click', function(){
    closeSheet('genericSheet');
    openActivityForm(null, dateIso);
  });
  document.querySelectorAll('[data-activity-open]').forEach(function(c){
    c.addEventListener('click', function(){
      var act = activities.find(function(x){ return x.id === c.getAttribute('data-activity-open'); });
      closeSheet('genericSheet');
      openActivityForm(act, dateIso);
    });
  });
}


// ---------- 로그인 ----------
function saveSession(memberId){
  try{ localStorage.setItem(LOCAL_SESSION_KEY, memberId); }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem(LOCAL_SESSION_KEY); }catch(e){}
}
function getSavedSession(){
  try{ return localStorage.getItem(LOCAL_SESSION_KEY); }catch(e){ return null; }
}

async function renderLoginScreen(){
  var app = document.getElementById('app');
  groups = await loadGroups();

  var html = '';
  html += '<div class="screen" style="padding-top:60px;">';
  html += '<div style="text-align:center;margin-bottom:32px;">';
  html += '<h1 style="font-size:26px;">🙏 소그룹커뮤</h1>';
  html += '<p class="savehint" style="margin-top:6px;">교회 소그룹 모임 관리</p>';
  html += '</div>';

  html += '<div class="card">';
  html += '<div class="field"><span class="field-label">소그룹 선택</span><select id="login_group">';
  if(groups.length === 0){
    html += '<option value="">등록된 소그룹이 없어요</option>';
  }else{
    groups.forEach(function(g){ html += '<option value="'+g.id+'">'+escapeHtml(g.name)+'</option>'; });
  }
  html += '</select></div>';
  html += '<div class="field"><span class="field-label">이름</span><input type="text" id="login_name" placeholder="이름을 입력하세요"></div>';
  html += '<div class="field"><span class="field-label">PIN 번호</span><input type="password" id="login_pin" inputmode="numeric" placeholder="4자리 PIN"></div>';
  html += '<p class="savehint" id="login_error" style="color:var(--brick);min-height:18px;"></p>';
  html += '<button class="btn btn-primary btn-block" id="login_btn" type="button">로그인</button>';
  html += '</div>';

  if(groups.length === 0){
    html += '<button class="btn btn-block" id="login_firstSetupBtn" type="button" style="margin-top:8px;">🌱 아직 소그룹이 없어요 — 처음 시작하기</button>';
  }

  html += '</div>';

  app.innerHTML = html;

  if(groups.length === 0){
    document.getElementById('login_firstSetupBtn').addEventListener('click', openFirstSetupSheet);
  }

  document.getElementById('login_btn').addEventListener('click', async function(){
    var groupId = document.getElementById('login_group').value;
    var name = document.getElementById('login_name').value.trim();
    var pin = document.getElementById('login_pin').value.trim();
    var errEl = document.getElementById('login_error');
    if(!groupId){ errEl.textContent = '소그룹을 선택해주세요.'; return; }
    if(!name || !pin){ errEl.textContent = '이름과 PIN을 입력해주세요.'; return; }

    var res = await supabaseClient.from('sg_members').select('*').eq('group_id', groupId).eq('name', name).eq('pin', pin).limit(1);
    if(res.error || !res.data || res.data.length === 0){
      errEl.textContent = '이름 또는 PIN이 일치하지 않아요.';
      return;
    }
    currentMember = res.data[0];
    saveSession(currentMember.id);
    await loadGroupData(currentMember.group_id);
    activeTab = 'calendar';
    renderMainApp();
  });
}

function openFirstSetupSheet(){
  var html = '';
  html += '<p class="savehint" style="margin-bottom:12px;">가장 처음이라 소그룹이 하나도 없어요. 첫 소그룹과 최고관리자 계정을 만들어요. 이후 새 소그룹 추가는 이 계정만 할 수 있어요.</p>';
  html += '<div class="field"><span class="field-label">소그룹 이름</span><input type="text" id="setup_groupName" placeholder="예: 은혜1소그룹"></div>';
  html += '<div class="field"><span class="field-label">최고관리자 이름</span><input type="text" id="setup_adminName" placeholder="이름"></div>';
  html += '<div class="field"><span class="field-label">PIN(4자리)</span><input type="password" id="setup_adminPin" inputmode="numeric" placeholder="4자리 숫자"></div>';
  html += '<button class="btn btn-primary btn-block" id="setup_confirmBtn" type="button" style="margin-top:12px;">시작하기</button>';

  document.getElementById('genericSheetTitle').textContent = '🌱 처음 시작하기';

    if(groupRes.error){ showToast('소그룹 생성 실패: '+groupRes.error.message); return; }

    closeSheet('genericSheet');
    showToast('설정 완료! 방금 만든 계정으로 로그인해주세요.');

  });
}

// ---------- 초기화 ----------
async function initApp(){
  try{
    var savedId = getSavedSession();
    if(savedId){
      var res = await supabaseClient.from('sg_members').select('*').eq('id', savedId).limit(1);
      if(!res.error && res.data && res.data.length > 0){
        currentMember = res.data[0];
        await loadGroupData(currentMember.group_id);
        renderMainApp();
        return;
      }
    }
    await renderLoginScreen();
  }catch(err){
    console.error('initApp error:', err);
    document.getElementById('app').innerHTML =
      '<div class="screen" style="padding-top:80px;text-align:center;">'+
      '<p style="font-size:40px;">⚠️</p>'+
      '<p class="field-label-strong">서버에 연결하지 못했어요.</p>'+
      '<p class="savehint" style="margin-top:8px;">인터넷 연결, 방화벽/광고차단 확장 프로그램을 확인한 뒤 새로고침 해주세요.</p>'+
      '<button class="btn btn-primary" style="margin-top:16px;" onclick="location.reload()">다시 시도</button>'+
      '</div>';
  }
}
if(supabaseClient) initApp();
</script>
