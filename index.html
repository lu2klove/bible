<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>

  :root{
    --paper:#ECEAE0;
    --paper-raised:#F6F4EB;
    --ink:#20241D;
    --ink-soft:#5B6153;
    --ink-faint:#8B9081;
    --line:#C9C6B2;
    --pine:#3F6357;
    --pine-soft:#DCE5DF;
    --brick:#A8452F;
    --brick-soft:#F0DAD2;
    --olive:#8A7B4E;
    --olive-soft:#EAE3CC;
    --blue:#2B6FCB;
    --blue-soft:#DCE7F5;
    --amber:#B8791E;
    --amber-soft:#F0E0BE;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'IBM Plex Sans KR','Noto Sans KR',sans-serif;
    background:var(--paper); color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3{font-family:'Noto Serif KR',serif; margin:0;}
  input,select,textarea,button{font-family:inherit; font-size:15px;}
  input[type="text"],input[type="password"],input[type="number"],input[type="date"],select,textarea{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px;
    background:var(--paper-raised); color:var(--ink);
  }
  .app{max-width:520px; margin:0 auto; min-height:100vh; background:var(--paper); position:relative;}
  @media (min-width:900px){
    body{ background:var(--line); }
    .app{ max-width:640px; box-shadow:0 0 0 1px var(--line), 0 12px 40px rgba(0,0,0,0.12); }
  }
  @media (min-width:1200px){
    .app{ max-width:760px; }
  }
  .screen{padding:16px; padding-bottom:90px;}
  .header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px; border-bottom:1px solid var(--line); background:var(--paper-raised);
    position:sticky; top:0; z-index:20;
  }
  .header h1{font-size:18px;}
  .field{margin-bottom:12px;}
  .field-label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
  .field-label-strong{font-size:14px; color:var(--ink); font-weight:700;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:11px 16px; border-radius:9px; border:1px solid var(--line);
    background:var(--paper-raised); color:var(--ink); cursor:pointer; font-weight:600;
  }
  .btn-primary{background:var(--pine); border-color:var(--pine); color:#fff;}
  .btn-danger{background:var(--brick-soft); border-color:var(--brick); color:var(--brick);}
  .btn-block{width:100%;}
  .card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:12px;
  }
  .chip{
    display:inline-flex; align-items:center; padding:8px 13px; border-radius:999px;
    border:1px solid var(--line); background:var(--paper-raised); color:var(--ink-soft);
    font-size:13.5px; cursor:pointer; font-weight:600;
  }
  .chip.selected{background:var(--pine); border-color:var(--pine); color:#fff;}
  .chiprow{display:flex; gap:8px; flex-wrap:wrap;}
  .badge{
    display:inline-flex; align-items:center; padding:3px 9px; border-radius:999px;
    font-size:11.5px; font-weight:700;
  }
  .badge-admin{background:var(--amber-soft); color:var(--amber);}
  .empty-inline{color:var(--ink-faint); font-size:13.5px; padding:14px 0;}
  .savehint{font-size:12.5px; color:var(--ink-faint); line-height:1.5;}
  .row2{display:flex; gap:8px;}
  .row2 > *{flex:1;}
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto;
    display:flex; border-top:1px solid var(--line); background:var(--paper-raised); z-index:30;
  }
  @media (min-width:900px){ .tabbar{ max-width:640px; } }
  @media (min-width:1200px){ .tabbar{ max-width:760px; } }
  .tabbar button{
    flex:1; background:none; border:none; padding:11px 4px 9px; display:flex; flex-direction:column;
    align-items:center; gap:2px; color:var(--ink-faint); font-size:11px; font-weight:600; cursor:pointer;
  }
  .tabbar button.active{color:var(--pine);}
  .tabbar button .ico{font-size:19px;}
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:80; display:none;
  }
  .overlay.open{display:block;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; max-width:520px; margin:0 auto;
    background:var(--paper); border-radius:16px 16px 0 0; z-index:90;
    max-height:88vh; overflow-y:auto; padding:18px 16px 24px;
    transform:translateY(100%); transition:transform 0.25s ease;
  }
  @media (min-width:900px){ .sheet{ max-width:640px; } }
  @media (min-width:1200px){ .sheet{ max-width:760px; } }

  .sheet-title{font-size:17px; font-weight:700; font-family:'Noto Serif KR',serif;}
  .sheet-close{background:none; border:none; font-size:20px; color:var(--ink-faint); cursor:pointer;}
  .toast{
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:999px;
    font-size:13.5px; z-index:100; opacity:0; pointer-events:none; transition:opacity 0.2s;
  }
  .toast.show{opacity:1;}
  .announce-bar{
    background:var(--amber-soft); border:1px solid var(--amber); border-radius:10px;
    padding:10px 12px; margin-bottom:14px; font-size:13px; color:var(--ink);
  }
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center;}
  .cal-dow{font-size:11px; color:var(--ink-faint); padding:6px 0; font-weight:700;}
  .cal-cell{
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:8px; cursor:pointer; font-size:13px; position:relative; gap:2px;
  }
  .cal-cell.today{border:1.5px solid var(--pine);}
  .cal-cell.has-activity::after{
    content:''; width:5px; height:5px; border-radius:50%; background:var(--brick); position:absolute; bottom:4px;
  }
  .cal-cell .reading-done-ico{position:absolute; top:1px; right:2px; font-size:9px; line-height:1;}
  .cal-cell.faded{color:var(--ink-faint);}
  .cal-cell.sunday, .cal-cell.holiday{color:var(--brick); font-weight:700;}
  .cal-cell.saturday{color:var(--blue); font-weight:700;}
  .cal-dow.sunday{color:var(--brick);}
  .cal-dow.saturday{color:var(--blue);}
  .member-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line);}
  .member-row:last-child{border-bottom:none;}
  .progress-bar-bg{height:8px; background:var(--line); border-radius:4px; overflow:hidden;}
  .progress-bar-fill{height:100%; background:var(--pine);}

// ---------- 유틸 ----------
function uid(){ return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9); }
function todayStr(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function compressImageToDataURL(file, callback, maxWidthOverride){
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var maxW = maxWidthOverride || 1000;
      var scale = Math.min(1, maxW / img.width);
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function openImageViewer(dataUrl){
  var overlay = document.getElementById('imgViewerOverlay');
  document.getElementById('imgViewerImg').src = dataUrl;
  overlay.style.display = 'flex';
}
function closeImageViewer(){

var toastTimer = null;
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}
function openSheet(id){
  document.getElementById(id).classList.add('open');
  document.getElementById('sheetBackdrop').classList.add('open');
}
function closeSheet(id){
  document.getElementById(id).classList.remove('open');
  document.getElementById('sheetBackdrop').classList.remove('open');
}
function niceDate(dateStr){
  var d = new Date(dateStr+'T00:00:00');
  var days = ['일','월','화','수','목','금','토'];
  return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+days[d.getDay()]+')';
}
function addDays(dateStr, n){
  var d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function daysBetweenInclusive(startStr, endStr){
  var s = new Date(startStr+'T00:00:00'), e = new Date(endStr+'T00:00:00');
  return Math.round((e - s) / 86400000) + 1;
}

var memberPeriodFilter = 'all'; // 'month' | 'quarter' | 'all'

function getPeriodRange(filter){
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth(); // 0-based
  if(filter === 'month'){
    var start = y+'-'+String(m+1).padStart(2,'0')+'-01';
    return { start: start, end: todayStr() };
  }
  if(filter === 'quarter'){
    var qStartMonth = Math.floor(m/3)*3; // 0,3,6,9
    var start2 = y+'-'+String(qStartMonth+1).padStart(2,'0')+'-01';
    return { start: start2, end: todayStr() };
  }
  return null; // 전체
}

function computeAttendanceStats(periodFilter){
  var range = getPeriodRange(periodFilter);
  var relevantActivityIds = {};
  activities.forEach(function(a){
    if(!range || (a.date >= range.start && a.date <= range.end)){ relevantActivityIds[a.id] = true; }
  });
  var stats = {};
  members.forEach(function(m){ stats[m.id] = { present:0, total:0 }; });
  attendance.forEach(function(a){
    if(!stats[a.member_id]) return;
    if(!relevantActivityIds[a.activity_id]) return;
    stats[a.member_id].total++;
    if(a.present) stats[a.member_id].present++;
  });
  return stats;
}

// ---------- 성경통독 계산 ----------
// 시작일~종료일 사이 매일, 순서대로 성경 장(chapter)을 균등 배분해서
// 그 날 읽어야 할 범위(시작책/장 ~ 끝책/장)를 계산해요.
function computeReadingPlanDayRange(plan, dateIso){
  var books = plan.testament === 'OT' ? OT_BOOKS : (plan.testament === 'NT' ? NT_BOOKS : OT_BOOKS.concat(NT_BOOKS));
  var flat = flattenBooks(books);
  var totalChapters = flat.length;
  var totalDays = daysBetweenInclusive(plan.start_date, plan.end_date);
  if(totalDays <= 0) return null;

  var dayIndex = daysBetweenInclusive(plan.start_date, dateIso) - 1; // 0-based
  if(dayIndex < 0 || dayIndex >= totalDays) return null;

  // 각 날짜가 담당할 장의 [start,end) 인덱스 범위를 균등 배분(나머지는 앞쪽 날짜에 1장씩 더).
  var base = Math.floor(totalChapters / totalDays);
  var extra = totalChapters % totalDays;
  var startIdx = dayIndex * base + Math.min(dayIndex, extra);
  var countForDay = base + (dayIndex < extra ? 1 : 0);
  var endIdx = startIdx + countForDay;
  if(countForDay <= 0) return { chapters: [] };

  return { chapters: flat.slice(startIdx, endIdx) };
}
function testamentTotalChapters(testament){
  if(testament === 'OT') return 929;
  if(testament === 'NT') return 260;
  return 1189;
}
function formatChapterRange(chapters){
  if(!chapters || chapters.length === 0) return '오늘은 읽을 분량이 없어요.';
  var first = chapters[0], last = chapters[chapters.length-1];
  if(first.book === last.book){
    return first.chapter === last.chapter
      ? first.book+' '+first.chapter+'장'
      : first.book+' '+first.chapter+'장 ~ '+last.chapter+'장';
  }
  return first.book+' '+first.chapter+'장 ~ '+last.book+' '+last.chapter+'장';
}
// 통독 설정 저장 시점에 DB에 확정 저장해 둔 하루치 범위를 문자열로 만들어요.
// (예전에 만들어진 통독 계획이라 확정 저장된 값이 없으면, 그때만 즉석 계산으로 보완해요.)
function formatStoredRange(progressRow, plan){
  if(progressRow && progressRow.range_start_book){
    return formatChapterRange([
      { book: progressRow.range_start_book, chapter: progressRow.range_start_chapter },
      { book: progressRow.range_end_book, chapter: progressRow.range_end_chapter }
    ]);
  }
  if(plan){
    var range = computeReadingPlanDayRange(plan, progressRow ? progressRow.date : null);
    return formatChapterRange(range ? range.chapters : []);
  }
  return '오늘은 읽을 분량이 없어요.';
}
function getStoredStartChapter(progressRow, plan, dateIso){
  if(progressRow && progressRow.range_start_book){
    return { book: progressRow.range_start_book, chapter: progressRow.range_start_chapter };
  }
  var range = computeReadingPlanDayRange(plan, dateIso);
  return range && range.chapters[0] ? range.chapters[0] : null;
}

async function renderMyTab(){

  var completedCount = progress.filter(function(p){ return p.completed; }).length;

    html += '<div style="margin:14px 0 6px;position:relative;height:22px;">';
    html += '<div class="progress-bar-bg" style="position:absolute;top:7px;left:0;right:0;"><div class="progress-bar-fill" style="width:'+pct+'%;"></div></div>';
    html += '<span style="position:absolute;top:-2px;left:calc('+pct+'% - 10px);font-size:18px;transition:left 0.3s;">🏃</span>';
    html += '</div>';
    html += '<p class="savehint">'+completedCount+' / '+totalDays+'일 완료 ('+pct+'%)</p>';

    html += '<p class="field-label-strong" style="margin-top:14px;">통독 현황표</p>';
    var completedDates = {};
    var progressRowsByDate = {};
    progress.forEach(function(p){
      progressRowsByDate[p.date] = p;
      if(p.completed) completedDates[p.date] = true;
    });

    // 날짜를 월별로 묶어요.
    var monthGroups = {}; // 'YYYY-MM' -> [dateStr, ...]
    var monthOrder = [];
    for(var i=0; i<totalDays; i++){
      var d = addDays(plan.start_date, i);
      var ym = d.slice(0,7);
      if(!monthGroups[ym]){ monthGroups[ym] = []; monthOrder.push(ym); }
      monthGroups[ym].push(d);
    }
    // 기본으로 오늘이 속한 달(통독 기간 안이면)을 펼쳐둬요.
    var todayYm = todayStr().slice(0,7);
    if(monthGroups[todayYm] && expandedReadingMonths[todayYm] === undefined){ expandedReadingMonths[todayYm] = true; }

    monthOrder.forEach(function(ym){
      var days = monthGroups[ym];
      var doneInMonth = days.filter(function(d){ return completedDates[d]; }).length;
      var expanded = !!expandedReadingMonths[ym];
      var yLabel = ym.slice(0,4)+'년 '+parseInt(ym.slice(5,7),10)+'월';
      html += '<div class="card" style="margin-top:8px;padding:10px 12px;">';
      html += '<div data-month-toggle="'+ym+'" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;">';
      html += '<span style="font-weight:700;">'+yLabel+'</span>';
      html += '<span class="savehint">'+doneInMonth+'/'+days.length+'일 '+(expanded?'▲':'▼')+'</span>';
      html += '</div>';
      if(expanded){
        html += '<div style="margin-top:8px;">';
        days.forEach(function(d){
          var done = !!completedDates[d];
          var row = progressRowsByDate[d];
          html += '<div class="member-row"><span>'+niceDate(d)+' · '+formatStoredRange(row, plan)+'</span>';
          html += '<span style="'+(done?'color:var(--pine);font-weight:700;':'color:var(--ink-faint);')+'">'+(done?'✅':'—')+'</span></div>';
        });
        html += '</div>';
      }
      html += '</div>';
    });
  }else{
    html += '<p class="empty-inline">아직 통독 설정을 안 하셨어요.</p>';
  }
  html += '</div></div>';

  el.innerHTML = html;

    });
  });

function openReadingSettingsSheet(existingPlan){
  var e = existingPlan || {};
  var html = '';
  html += '<div class="field"><span class="field-label">통독 범위</span><div class="chiprow">';
  html += '<button type="button" class="chip'+((e.testament||'OT')==='OT'?' selected':'')+'" data-testament="OT">구약 (39권 929장)</button>';
  html += '<button type="button" class="chip'+(e.testament==='NT'?' selected':'')+'" data-testament="NT">신약 (27권 260장)</button>';
  html += '<button type="button" class="chip'+(e.testament==='BOTH'?' selected':'')+'" data-testament="BOTH">전체 구약+신약 (66권 1189장)</button>';
  html += '</div></div>';
  html += '<div class="field"><span class="field-label">시작일</span><input type="date" id="rp_start" value="'+(e.start_date||todayStr())+'"></div>';
  html += '<div class="field"><span class="field-label">종료일</span><input type="date" id="rp_end" value="'+(e.end_date||'')+'"></div>';
  html += '<p class="savehint">시작일부터 종료일까지 매일 읽을 분량이 자동으로 균등 배분돼요.</p>';
  html += '<button class="btn btn-primary btn-block" id="rp_saveBtn" type="button" style="margin-top:10px;">저장</button>';

  document.getElementById('genericSheetTitle').textContent = '📖 성경통독 설정';
  document.getElementById('genericSheetBody').innerHTML = html;
  openSheet('genericSheet');

  var selectedTestament = e.testament || 'OT';
  document.querySelectorAll('#genericSheetBody [data-testament]').forEach(function(chip){
    chip.addEventListener('click', function(){
      selectedTestament = chip.getAttribute('data-testament');
      document.querySelectorAll('#genericSheetBody [data-testament]').forEach(function(c){ c.classList.remove('selected'); });
      chip.classList.add('selected');
    });
  });

  document.getElementById('rp_saveBtn').addEventListener('click', async function(){
    var start = document.getElementById('rp_start').value;
    var end = document.getElementById('rp_end').value;
    if(!start || !end || end < start){ showToast('올바른 시작일/종료일을 선택해주세요.'); return; }

    var planId = uid();
    var payload = { id: planId, member_id: currentMember.id, testament: selectedTestament, start_date: start, end_date: end };
    var res = await supabaseClient.from('sg_reading_plans').insert(payload);
    if(res.error){ showToast('저장 실패: '+res.error.message); return; }

    // 이 시점에 매일의 장절 범위를 확정해서 저장해요. 나중에 설정을 다시 바꿔도
    // 이미 확정된(과거) 날짜의 장절은 절대 바뀌지 않아요.
    var totalDaysNew = daysBetweenInclusive(start, end);
    var progressRows = [];
    for(var i=0; i<totalDaysNew; i++){
      var d = addDays(start, i);
      var range = computeReadingPlanDayRange(payload, d);
      var chapters = range ? range.chapters : [];
      var first = chapters[0], last = chapters[chapters.length-1];
      progressRows.push({
        id: uid(), plan_id: planId, date: d, completed: false,
        range_start_book: first ? first.book : null, range_start_chapter: first ? first.chapter : null,
        range_end_book: last ? last.book : null, range_end_chapter: last ? last.chapter : null
      });
    }
    if(progressRows.length > 0){
      var progRes = await supabaseClient.from('sg_reading_progress').insert(progressRows);
      if(progRes.error){ showToast('통독 일정 생성 실패: '+progRes.error.message); return; }
    }

    closeSheet('genericSheet');
    showToast('통독 설정이 저장됐어요.');
    renderMyTab();
  });
}

async function openDailyReadingForDate(dateIso){
  var plan = await loadReadingPlan(currentMember.id);
  var html = '';
  if(!plan){
    html += '<p class="empty-inline">먼저 마이메뉴에서 성경통독 설정을 해주세요.</p>';
    document.getElementById('dailyReadingSheetBody').innerHTML = html;
    openSheet('dailyReadingSheet');
    return;
  }
  var progress = await loadReadingProgress(plan.id);
  var existingRow = progress.find(function(p){ return p.date === dateIso; });
  var done = existingRow && existingRow.completed;

  // 통독 설정을 저장할 때 이미 이 날짜의 범위가 확정 저장돼 있으면 그 값을 써요
  // (나중에 설정을 바꿔도 안 바뀌게). 레거시 계획이라 저장된 값이 없으면 그때만 즉석 계산해요.
  var chapters;
  if(existingRow && existingRow.range_start_book){
    chapters = [
      { book: existingRow.range_start_book, chapter: existingRow.range_start_chapter },
      { book: existingRow.range_end_book, chapter: existingRow.range_end_chapter }
    ];
  }else{
    var liveRange = computeReadingPlanDayRange(plan, dateIso);
    if(!liveRange){
      html += '<p class="empty-inline">'+niceDate(dateIso)+'은(는) 통독 기간(' +plan.start_date+' ~ '+plan.end_date+') 밖이에요.</p>';
      document.getElementById('dailyReadingSheetBody').innerHTML = html;
      openSheet('dailyReadingSheet');
      return;
    }
    chapters = liveRange.chapters;
  }

  html += '<p class="field-label-strong">'+niceDate(dateIso)+'</p>';
  html += '<div class="card" style="text-align:center;margin-top:10px;">';
  html += '<p style="font-size:20px;font-weight:700;font-family:\'Noto Serif KR\',serif;">'+formatChapterRange(chapters)+'</p>';
  html += '</div>';

  var startChapter = chapters[0];
  if(startChapter){
    var readUrl = bskoreaReadUrl(startChapter.book, startChapter.chapter);
    if(readUrl){
      html += '<a href="'+readUrl+'" target="_blank" rel="noopener" class="btn btn-block" style="margin-bottom:8px;text-decoration:none;">📖 대한성서공회에서 말씀 읽기</a>';
      html += '<p class="savehint" style="text-align:center;margin-bottom:8px;">'+escapeHtml(startChapter.book)+' '+startChapter.chapter+'장부터 열려요. 이후 장은 그 페이지의 "다음" 버튼으로 넘겨서 읽으세요.</p>';
    }
  }

  if(done){
    html += '<div class="card" style="text-align:center;background:var(--pine-soft);border-color:var(--pine);"><p style="font-weight:700;color:var(--pine);">✅ 읽기 완료!</p></div>';
  }else{
    html += '<button class="btn btn-primary btn-block" id="dr_completeBtn" type="button" style="margin-top:8px;">읽기 완료</button>';
  }

  document.getElementById('dailyReadingSheetBody').innerHTML = html;
  openSheet('dailyReadingSheet');

  if(!done){
    document.getElementById('dr_completeBtn').addEventListener('click', async function(){
      var first = chapters[0], last = chapters[chapters.length-1];
      var rangeFields = {
        range_start_book: first.book, range_start_chapter: first.chapter,
        range_end_book: last.book, range_end_chapter: last.chapter
      };
      var payload = existingRow
        ? Object.assign({ completed: true, completed_at: new Date().toISOString() }, rangeFields)
        : Object.assign({ id: uid(), plan_id: plan.id, date: dateIso, completed: true, completed_at: new Date().toISOString() }, rangeFields);
      var res = existingRow
        ? await supabaseClient.from('sg_reading_progress').update(payload).eq('id', existingRow.id)
        : await supabaseClient.from('sg_reading_progress').insert(payload);
      if(res.error){ showToast('저장 실패: '+res.error.message); return; }
      showToast('오늘의 통독을 완료했어요! 🎉');
      openDailyReadingForDate(dateIso);
    });
  }
}

// ---------- 캘린더 탭 ----------
async function renderCalendarTab(){
  var el = document.getElementById('tabContent');

  // 이번 달에 통독 완료한 날짜들을 미리 조회해서 캘린더에 표시해요.
  var completedReadingDates = {};
  var plan = await loadReadingPlan(currentMember.id);
  if(plan){
    var progress = await loadReadingProgress(plan.id);
    progress.forEach(function(p){ if(p.completed) completedReadingDates[p.date] = true; });
  }

  var html = '<div class="screen">';

  if(announcements.length > 0){
    announcements.slice(0,3).forEach(function(a){
      html += '<div class="announce-bar">📢 '+escapeHtml(a.content)+'</div>';
    });
  }

  html += '<div class="card">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">';
  html += '<button class="btn" id="cal_prevBtn" type="button" style="padding:6px 10px;">‹</button>';
  html += '<h2 style="font-size:16px;">'+calYear+'년 '+calMonth+'월</h2>';
  html += '<div style="display:flex;gap:6px;">';
  html += '<button class="btn" id="cal_todayBtn" type="button" style="padding:6px 10px;" aria-label="오늘로 이동">📅</button>';
  html += '<button class="btn" id="cal_nextBtn" type="button" style="padding:6px 10px;">›</button>';
  html += '</div></div>';

  html += '<div class="cal-grid">';
  ['일','월','화','수','목','금','토'].forEach(function(d,idx){
    var dowCls = idx===0?' sunday':(idx===6?' saturday':'');
    html += '<div class="cal-dow'+dowCls+'">'+d+'</div>';
  });

  var firstDay = new Date(calYear, calMonth-1, 1);
  var startWeekday = firstDay.getDay();
  var daysInMonth = new Date(calYear, calMonth, 0).getDate();
  var todayIso = todayStr();

  for(var i=0; i<startWeekday; i++){ html += '<div></div>'; }
  for(var d=1; d<=daysInMonth; d++){
    var iso = calYear+'-'+String(calMonth).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var weekday = new Date(calYear, calMonth-1, d).getDay();
    var holidayName = getHolidayName(iso);
    var hasActivity = activities.some(function(a){ return a.date === iso; });
    var cls = 'cal-cell';
    if(iso===todayIso) cls += ' today';
    if(hasActivity) cls += ' has-activity';
    if(holidayName) cls += ' holiday';
    else if(weekday===0) cls += ' sunday';
    else if(weekday===6) cls += ' saturday';
    html += '<div class="'+cls+'" data-date="'+iso+'"'+(holidayName?' title="'+escapeHtml(holidayName)+'"':'')+'>';
    html += d;
    if(completedReadingDates[iso]) html += '<span class="reading-done-ico">📖</span>';
    html += '</div>';
  }
  html += '</div></div>';
  html += '</div>';

  el.innerHTML = html;

  document.getElementById('cal_prevBtn').addEventListener('click', function(){
    calMonth--; if(calMonth < 1){ calMonth = 12; calYear--; }
    renderCalendarTab();
  });
  document.getElementById('cal_nextBtn').addEventListener('click', function(){
    calMonth++; if(calMonth > 12){ calMonth = 1; calYear++; }
    renderCalendarTab();
  });
  document.getElementById('cal_todayBtn').addEventListener('click', function(){
    var now = new Date();
    calYear = now.getFullYear(); calMonth = now.getMonth()+1;
    renderCalendarTab();
  });
  el.querySelectorAll('.cal-cell[data-date]').forEach(function(cell){
    cell.addEventListener('click', function(){
      openDateMenu(cell.getAttribute('data-date'));
    });
  });
}

  html += '<p class="savehint" id="act_gpsStatus" style="margin-bottom:12px;">'+(e.location_lat?'현재 좌표가 담겨 있어요('+e.location_lat.toFixed(4)+', '+e.location_lng.toFixed(4)+').':'좌표를 담으면 지도로 바로 열어볼 수 있어요.')+'</p>';

  html += '<input type="file" accept="image/*" id="act_receiptInput" style="display:none;">';

  html += '<div id="act_photoPreview">'+imagePreviewHTML('act_photo', e.photo_image)+'</div></div>';

  members.forEach(function(m){

    html += '<div class="member-row"><span>'+escapeHtml(m.name)+(m.role==='admin'?' <span class="badge badge-admin">관리자</span>':'')+'</span>';
    html += '<button type="button" class="chip'+checked+'" data-member-id="'+m.id+'">'+(presentIds[m.id]?'출석':'출석체크')+'</button></div>';
  });
  html += '</div>';

  html += '<div class="row2" style="margin-top:14px;">';
  html += '<button class="btn btn-block" id="act_cancelBtn" type="button">취소</button>';
  html += '<button class="btn btn-primary btn-block" id="act_saveBtn" type="button">'+(existing?'수정 완료':'등록')+'</button>';
  html += '</div>';
  if(existing){
    html += '<button class="btn btn-danger btn-block" id="act_deleteBtn" type="button" style="margin-top:8px;">이 활동 삭제</button>';
  }

  document.getElementById('activitySheetBody').innerHTML = html;
  openSheet('activitySheet');

    chip.addEventListener('click', function(){
      var mid = chip.getAttribute('data-member-id');
      if(toggledPresent[mid]){ delete toggledPresent[mid]; chip.classList.remove('selected'); chip.textContent = '출석체크'; }
      else{ toggledPresent[mid] = true; chip.classList.add('selected'); chip.textContent = '출석'; }
    });
  });

  var currentReceiptImage = e.receipt_image || null;
  var currentPhotoImage = e.photo_image || null;
  var currentLat = e.location_lat != null ? e.location_lat : null;
  var currentLng = e.location_lng != null ? e.location_lng : null;

  function wireImageField(prefix, getCurrent, setCurrent, inputId){
    function refresh(){
      document.getElementById(prefix+'Preview').innerHTML = imagePreviewHTML(prefix, getCurrent());
      wire();
    }
    function wire(){
      var addBtn = document.getElementById(prefix+'_addBtn');
      if(addBtn) addBtn.addEventListener('click', function(){ document.getElementById(inputId).click(); });
      var removeBtn = document.getElementById(prefix+'_removeBtn');
      if(removeBtn) removeBtn.addEventListener('click', function(){ setCurrent(null); refresh(); });
      var thumb = document.getElementById(prefix+'_thumb');
      if(thumb) thumb.addEventListener('click', function(){ openImageViewer(getCurrent()); });
    }
    wire();
    document.getElementById(inputId).addEventListener('change', function(ev){
      var file = ev.target.files[0];
      if(!file) return;
      compressImageToDataURL(file, function(dataUrl){ setCurrent(dataUrl); refresh(); });
    });
  }
  wireImageField('act_receipt', function(){ return currentReceiptImage; }, function(v){ currentReceiptImage = v; }, 'act_receiptInput');
  wireImageField('act_photo', function(){ return currentPhotoImage; }, function(v){ currentPhotoImage = v; }, 'act_photoInput');

  document.getElementById('act_gpsBtn').addEventListener('click', function(){
    var statusEl = document.getElementById('act_gpsStatus');
    if(!navigator.geolocation){ statusEl.textContent = '이 기기/브라우저는 위치 기능을 지원하지 않아요.'; return; }
    statusEl.textContent = '위치를 확인하는 중…';
    navigator.geolocation.getCurrentPosition(function(pos){
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;
      statusEl.textContent = '현재 좌표를 담았어요('+currentLat.toFixed(4)+', '+currentLng.toFixed(4)+').';
    }, function(err){
      statusEl.textContent = '위치를 가져오지 못했어요('+err.message+'). 브라우저 위치 권한을 확인해주세요.';
    });
  });

  document.getElementById('act_cancelBtn').addEventListener('click', function(){ closeSheet('activitySheet'); });
  if(existing){
    document.getElementById('act_deleteBtn').addEventListener('click', async function(){
      await supabaseClient.from('sg_attendance').delete().eq('activity_id', existing.id);
      await supabaseClient.from('sg_activities').delete().eq('id', existing.id);
      closeSheet('activitySheet');
      await loadGroupData(currentMember.group_id);
      renderCalendarTab();
      showToast('삭제했어요.');
    });
  }

  document.getElementById('act_saveBtn').addEventListener('click', async function(){
    var date = document.getElementById('act_date').value;
    var title = document.getElementById('act_title').value.trim();
    var memo = document.getElementById('act_memo').value.trim();
    if(!date || !title){ showToast('날짜와 제목을 입력해주세요.'); return; }

    var activityId = existing ? existing.id : uid();
    var payload = {
      id: activityId, group_id: currentMember.group_id, date: date, title: title, memo: memo,
      location_name: document.getElementById('act_locationName').value.trim() || null,
      location_lat: currentLat, location_lng: currentLng,
      receipt_image: currentReceiptImage, photo_image: currentPhotoImage
    };
    var res = existing
      ? await supabaseClient.from('sg_activities').update(payload).eq('id', activityId)
      : await supabaseClient.from('sg_activities').insert(payload);
    if(res.error){ showToast('저장 실패: '+res.error.message); return; }

    // 출석 upsert
    var attendanceRows = members.map(function(m){
      return { id: uid(), activity_id: activityId, member_id: m.id, present: !!toggledPresent[m.id] };
    });
    await supabaseClient.from('sg_attendance').delete().eq('activity_id', activityId);
    if(attendanceRows.length > 0){
      await supabaseClient.from('sg_attendance').insert(attendanceRows);
    }

    closeSheet('activitySheet');
    await loadGroupData(currentMember.group_id);
    renderCalendarTab();
    showToast(existing ? '수정했어요.' : '등록했어요.');
  });
}

function openDateMenu(dateIso){
  selectedCalDate = dateIso;
  var dayActivities = activities.filter(function(a){ return a.date === dateIso; });

  var html = '';
  html += '<p class="field-label-strong" style="margin-bottom:10px;">'+niceDate(dateIso)+'</p>';

  html += '<div class="chiprow" style="margin-bottom:14px;">';
  html += '<button class="chip" id="dm_readingBtn" type="button">📖 성경통독</button>';
  html += '</div>';

  html += '<p class="field-label-strong">소모임 활동</p>';
  if(dayActivities.length === 0){
    html += '<p class="empty-inline">등록된 활동이 없어요.</p>';
  }else{
    dayActivities.forEach(function(a){
      html += '<div class="card" data-activity-open="'+a.id+'" style="cursor:pointer;">';
      html += '<p style="font-weight:700;">'+escapeHtml(a.title)+'</p>';
      if(a.memo) html += '<p class="savehint" style="margin-top:4px;">'+escapeHtml(a.memo)+'</p>';
      if(a.location_name) html += '<p class="savehint" style="margin-top:4px;">📍 '+escapeHtml(a.location_name)+'</p>';
      if(a.receipt_image || a.photo_image) html += '<p class="savehint" style="margin-top:4px;">'+(a.receipt_image?'🧾 영수증 ':'')+(a.photo_image?'📷 사진':'')+'</p>';
      html += '</div>';
    });
  }
  html += '<button class="btn btn-block" id="dm_addActivityBtn" type="button" style="margin-top:8px;">+ 소모임 활동 등록</button>';

  document.getElementById('genericSheetTitle').textContent = '📅 '+niceDate(dateIso);
  document.getElementById('genericSheetBody').innerHTML = html;
  openSheet('genericSheet');

  document.getElementById('dm_readingBtn').addEventListener('click', function(){
    closeSheet('genericSheet');
    openDailyReadingForDate(dateIso);
  });
  document.getElementById('dm_addActivityBtn').addEventListener('click', function(){
    closeSheet('genericSheet');
    openActivityForm(null, dateIso);
  });
  document.querySelectorAll('[data-activity-open]').forEach(function(c){
    c.addEventListener('click', function(){
      var act = activities.find(function(x){ return x.id === c.getAttribute('data-activity-open'); });
      closeSheet('genericSheet');
      openActivityForm(act, dateIso);
    });
  });
}


// ---------- 로그인 ----------
function saveSession(memberId){
  try{ localStorage.setItem(LOCAL_SESSION_KEY, memberId); }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem(LOCAL_SESSION_KEY); }catch(e){}
}
function getSavedSession(){
  try{ return localStorage.getItem(LOCAL_SESSION_KEY); }catch(e){ return null; }
}

async function renderLoginScreen(){
  var app = document.getElementById('app');
  groups = await loadGroups();

  var html = '';
  html += '<div class="screen" style="padding-top:60px;">';
  html += '<div style="text-align:center;margin-bottom:32px;">';
  html += '<h1 style="font-size:26px;">🙏 소그룹커뮤</h1>';
  html += '<p class="savehint" style="margin-top:6px;">교회 소그룹 모임 관리</p>';
  html += '</div>';

  html += '<div class="card">';
  html += '<div class="field"><span class="field-label">소그룹 선택</span><select id="login_group">';
  if(groups.length === 0){
    html += '<option value="">등록된 소그룹이 없어요</option>';
  }else{
    groups.forEach(function(g){ html += '<option value="'+g.id+'">'+escapeHtml(g.name)+'</option>'; });
  }
  html += '</select></div>';
  html += '<div class="field"><span class="field-label">이름</span><input type="text" id="login_name" placeholder="이름을 입력하세요"></div>';
  html += '<div class="field"><span class="field-label">PIN 번호</span><input type="password" id="login_pin" inputmode="numeric" placeholder="4자리 PIN"></div>';
  html += '<p class="savehint" id="login_error" style="color:var(--brick);min-height:18px;"></p>';
  html += '<button class="btn btn-primary btn-block" id="login_btn" type="button">로그인</button>';
  html += '</div>';

  html += '</div>';

  app.innerHTML = html;

  document.getElementById('login_btn').addEventListener('click', async function(){
    var groupId = document.getElementById('login_group').value;
    var name = document.getElementById('login_name').value.trim();
    var pin = document.getElementById('login_pin').value.trim();
    var errEl = document.getElementById('login_error');
    if(!groupId){ errEl.textContent = '소그룹을 선택해주세요.'; return; }
    if(!name || !pin){ errEl.textContent = '이름과 PIN을 입력해주세요.'; return; }

    var res = await supabaseClient.from('sg_members').select('*').eq('group_id', groupId).eq('name', name).eq('pin', pin).limit(1);
    if(res.error || !res.data || res.data.length === 0){
      errEl.textContent = '이름 또는 PIN이 일치하지 않아요.';
      return;
    }
    currentMember = res.data[0];
    saveSession(currentMember.id);
    await loadGroupData(currentMember.group_id);
    activeTab = 'calendar';
    renderMainApp();
  });
}

function openNewGroupSheet(){
  var html = '';
  html += '<div class="field"><span class="field-label">소그룹 이름</span><input type="text" id="newgroup_name" placeholder="예: 은혜1소그룹"></div>';
  html += '<div class="field"><span class="field-label">첫 관리자 이름</span><input type="text" id="newgroup_adminName" placeholder="소그룹장 이름"></div>';
  html += '<div class="field"><span class="field-label">관리자 PIN(4자리)</span><input type="password" id="newgroup_adminPin" inputmode="numeric" placeholder="4자리 숫자"></div>';
  html += '<p class="savehint">새 소그룹을 만들면 입력한 분이 이 소그룹의 첫 관리자가 돼요. 이후 관리자가 다른 멤버를 추가할 수 있어요.</p>';
  html += '<button class="btn btn-primary btn-block" id="newgroup_confirmBtn" type="button" style="margin-top:12px;">소그룹 만들기</button>';

  document.getElementById('genericSheetBody').innerHTML = html;
  document.getElementById('genericSheetTitle').textContent = '🌱 새 소그룹 만들기';
  openSheet('genericSheet');

  document.getElementById('newgroup_confirmBtn').addEventListener('click', async function(){
    var name = document.getElementById('newgroup_name').value.trim();
    var adminName = document.getElementById('newgroup_adminName').value.trim();
    var adminPin = document.getElementById('newgroup_adminPin').value.trim();
    if(!name || !adminName || !adminPin){ showToast('모든 항목을 입력해주세요.'); return; }

    var groupRes = await supabaseClient.from('sg_groups').insert({ id: uid(), name: name }).select();
    if(groupRes.error){ showToast('소그룹 생성 실패: '+groupRes.error.message); return; }
    var newGroup = groupRes.data[0];

    var memberRes = await supabaseClient.from('sg_members').insert({
      id: uid(), group_id: newGroup.id, name: adminName, pin: adminPin, role: 'admin'
    });
    if(memberRes.error){ showToast('관리자 등록 실패: '+memberRes.error.message); return; }

    closeSheet('genericSheet');
    showToast('새 소그룹 "'+name+'"을(를) 만들었어요. '+adminName+'님이 그 소그룹의 첫 관리자예요.');
  });
}

// ---------- 초기화 ----------
async function initApp(){
  try{
    var savedId = getSavedSession();
    if(savedId){
      var res = await supabaseClient.from('sg_members').select('*').eq('id', savedId).limit(1);
      if(!res.error && res.data && res.data.length > 0){
        currentMember = res.data[0];
        await loadGroupData(currentMember.group_id);
        renderMainApp();
        return;
      }
    }
    await renderLoginScreen();
  }catch(err){
    console.error('initApp error:', err);
    document.getElementById('app').innerHTML =
      '<div class="screen" style="padding-top:80px;text-align:center;">'+
      '<p style="font-size:40px;">⚠️</p>'+
      '<p class="field-label-strong">서버에 연결하지 못했어요.</p>'+
      '<p class="savehint" style="margin-top:8px;">인터넷 연결, 방화벽/광고차단 확장 프로그램을 확인한 뒤 새로고침 해주세요.</p>'+
      '<button class="btn btn-primary" style="margin-top:16px;" onclick="location.reload()">다시 시도</button>'+
      '</div>';
  }
}
if(supabaseClient) initApp();
</script>
